<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMUC 2026 晋级推演台</title>
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --panel-soft: #f7f8fa;
  --panel-muted: #f2f4f7;
  --line: #e6ebf2;
  --line-strong: #d7dfeb;
  --ink: #172033;
  --muted: #71809a;
  --accent: #2256c8;
  --gold-bg: #fff6de;
  --gold-line: #edc76e;
  --cyan-bg: #eefbfd;
  --cyan-line: #9ed7df;
  --rose-bg: #faf3f3;
  --rose-line: #e9d2d2;
  --south: #d56243;
  --east: #4f8f3a;
  --north: #1b84a6;
  --shadow: 0 12px 28px rgba(24, 38, 73, 0.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 12px;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; }
.shell {
  max-width: 1600px;
  min-height: calc(100vh - 24px);
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto auto auto auto 1fr auto;
  gap: 10px;
}
.hero,
.banner,
.formula-card,
.ranking-card,
.region-card,
.stat,
#err {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero {
  border-radius: 18px;
  padding: 14px 18px 12px;
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.eyebrow {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: #30a46c;
}
h1 {
  margin: 8px 0 4px;
  font-size: 28px;
  line-height: 1.05;
}
.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  max-width: 900px;
}
.hero-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.refresh-btn {
  border: none;
  border-radius: 999px;
  padding: 9px 16px;
  background: linear-gradient(135deg, #2256c8, #1b459c);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.refresh-btn[disabled] {
  opacity: 0.72;
  cursor: progress;
}
.hero-meta {
  display: flex;
  gap: 10px 14px;
  flex-wrap: wrap;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}
.hero-meta .links {
  display: inline-flex;
  gap: 10px;
}
.sync-status {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 11px;
}
.sync-status.success {
  background: rgba(48, 164, 108, 0.08);
  border-color: rgba(48, 164, 108, 0.22);
  color: #1f7a50;
}
.sync-status.error {
  background: rgba(193, 91, 78, 0.08);
  border-color: rgba(193, 91, 78, 0.2);
  color: #a13c3c;
}
.sync-status.idle {
  background: rgba(34, 86, 200, 0.06);
  border-color: rgba(34, 86, 200, 0.16);
  color: #355ea6;
}
#err {
  display: none;
  border-radius: 14px;
  padding: 10px 12px;
  color: #a13c3c;
  background: #fff5f5;
  border-color: #f0d6d6;
}
.stats {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}
.stat {
  border-radius: 16px;
  padding: 10px 12px;
}
.stat .label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.stat .value {
  margin-top: 6px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1;
}
.stat .hint {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}
.tabs {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-soft);
  width: fit-content;
}
.tab-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.tab-btn.active {
  color: var(--accent);
  background: #ffffff;
  box-shadow: 0 6px 14px rgba(24, 38, 73, 0.08);
}
.panel {
  display: none;
  min-height: 0;
}
#panel-advancement.active,
#panel-strength.active,
#panel-region-strength.active,
#panel-shark-decision.active {
  display: grid;
  gap: 10px;
  overflow: hidden;
}
#panel-advancement.active {
  grid-template-rows: auto 1fr;
}
#panel-strength.active,
#panel-region-strength.active {
  grid-template-rows: auto 1fr;
}
#panel-shark-decision.active {
  grid-template-rows: auto;
}
.banner,
.formula-card,
.ranking-card {
  border-radius: 18px;
  padding: 12px 16px;
}
.banner {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.banner h2,
.formula-card h2,
.ranking-card h2 {
  margin: 0 0 4px;
  font-size: 17px;
}
.banner p,
.formula-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.pill-row,
.meta-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 11px;
  color: var(--muted);
  background: var(--panel-soft);
  border: 1px solid var(--line);
}
.pill strong { color: var(--ink); }
.region-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  align-items: stretch;
}
.region-card {
  min-height: 0;
  min-block-size: clamp(520px, 62vh, 760px);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.region-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 8px;
}
.region-head h3 {
  margin: 0;
  font-size: 22px;
}
.region-card[data-region="南部"] h3 { color: var(--south); }
.region-card[data-region="东部"] h3 { color: var(--east); }
.region-card[data-region="北部"] h3 { color: var(--north); }
.city {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}
.region-count {
  text-align: right;
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
}
.region-count span {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.spot-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 8px;
}
.spot-box {
  border-radius: 14px;
  padding: 10px 10px 8px;
  border: 1px solid var(--line);
}
.spot-box.national { background: var(--gold-bg); border-color: var(--gold-line); }
.spot-box.revival { background: var(--cyan-bg); border-color: var(--cyan-line); }
.spot-box.total { background: var(--panel-soft); }
.spot-box .k {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.spot-box .v {
  margin-top: 4px;
  font-size: 19px;
  font-weight: 800;
}
.mini-table {
  display: grid;
  gap: 4px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.mini-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
}
.mini-row strong {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.member-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0 2px 0 0;
  display: grid;
  gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  overflow-y: auto;
}
.member {
  border-radius: 14px;
  border: 1px solid var(--line);
  padding: 8px 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  align-items: center;
}
.member.qual-national { background: var(--gold-bg); border-color: var(--gold-line); }
.member.qual-revival { background: var(--cyan-bg); border-color: var(--cyan-line); }
.member.qual-none { background: var(--rose-bg); border-color: var(--rose-line); }
.member.boundary {
  box-shadow: 0 0 0 2px rgba(34, 86, 200, 0.08);
}
.member-main {
  min-width: 0;
}
.member-title {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.member-title .school {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
}
.member-title .team {
  font-size: 10px;
  color: var(--muted);
}
.member-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}
.member-side {
  text-align: right;
  white-space: nowrap;
}
.score {
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
}
.score-label {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
}
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.badge.qual-national { background: rgba(201, 141, 22, 0.16); color: #8a5f00; }
.badge.qual-revival { background: rgba(17, 132, 166, 0.12); color: #0d6f87; }
.badge.qual-none { background: rgba(193, 91, 78, 0.12); color: #9b3f34; }
.badge.flow-host { background: rgba(201, 141, 22, 0.14); color: #8a5f00; }
.badge.flow-volunteer { background: rgba(34, 86, 200, 0.1); color: var(--accent); }
.badge.flow-transfer { background: rgba(193, 91, 78, 0.12); color: #9b3f34; }
.badge.boundary { background: #ffffff; color: var(--ink); border: 1px solid var(--line-strong); }
.badge.submit-live { background: rgba(34, 86, 200, 0.08); color: var(--accent); }
.badge.submit-prediction { background: rgba(113, 128, 154, 0.16); color: #5f6c81; }
.member.unsubmitted,
.member.unsubmitted.qual-national,
.member.unsubmitted.qual-revival,
.member.unsubmitted.qual-none {
  background: #f4f6f9;
  border-color: #d9dfe8;
}
.member.unsubmitted .member-title .school,
.member.unsubmitted .score {
  color: #556279;
}
.member.unsubmitted .member-sub,
.member.unsubmitted .score-label,
.member.unsubmitted .member-title .team {
  color: #8a96a8;
}
.hidden-block {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel-muted);
  color: var(--muted);
}
.hidden-block summary {
  cursor: pointer;
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 700;
  list-style: none;
}
.hidden-block summary::-webkit-details-marker { display: none; }
.hidden-list {
  border-top: 1px solid var(--line);
  padding: 6px 10px 8px;
  display: grid;
  gap: 5px;
}
.hidden-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
}
.hidden-item .name {
  color: #4f5d74;
  font-weight: 700;
}
.empty {
  padding: 18px 12px;
  text-align: center;
  color: var(--muted);
  background: var(--panel-soft);
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  font-size: 12px;
}
.formula-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.formula-item {
  border: 1px solid var(--line);
  background: var(--panel-soft);
  border-radius: 14px;
  padding: 10px 12px;
}
.formula-item .title {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.formula-item .formula {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
}
.ranking-card {
  min-height: 0;
  min-block-size: clamp(560px, 64vh, 860px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.strength-stage {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 18px;
  padding: 14px 16px;
}
.strength-stage-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.strength-stage-head h2 {
  margin: 0 0 4px;
  font-size: 17px;
}
.strength-stage-head p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  max-width: 920px;
}
.strength-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.strength-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  display: grid;
  gap: 12px;
  background: linear-gradient(180deg, #ffffff, #f7f9fc);
}
.strength-card[data-region="南部"] {
  border-color: rgba(213, 98, 67, 0.28);
  background: linear-gradient(180deg, rgba(213, 98, 67, 0.08), #ffffff 55%);
}
.strength-card[data-region="南部"] h3 { color: var(--south); }
.strength-card[data-region="东部"] {
  border-color: rgba(79, 143, 58, 0.28);
  background: linear-gradient(180deg, rgba(79, 143, 58, 0.08), #ffffff 55%);
}
.strength-card[data-region="东部"] h3 { color: var(--east); }
.strength-card[data-region="北部"] {
  border-color: rgba(27, 132, 166, 0.28);
  background: linear-gradient(180deg, rgba(27, 132, 166, 0.08), #ffffff 55%);
}
.strength-card[data-region="北部"] h3 { color: var(--north); }
.strength-card-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}
.strength-rank {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.strength-card h3 {
  margin: 4px 0 0;
  font-size: 24px;
  line-height: 1;
}
.strength-lead {
  text-align: right;
}
.strength-lead .v {
  font-size: 32px;
  font-weight: 900;
  line-height: 1;
}
.strength-lead .k {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}
.strength-mini-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.strength-mini {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.72);
}
.strength-mini .k {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.strength-mini .v {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
}
.strength-metrics {
  display: grid;
  gap: 8px;
}
.strength-metric {
  display: grid;
  grid-template-columns: 76px 1fr auto;
  gap: 8px;
  align-items: center;
  font-size: 11px;
}
.strength-metric .label {
  color: var(--muted);
}
.strength-track {
  height: 8px;
  border-radius: 999px;
  background: rgba(23, 32, 51, 0.08);
  overflow: hidden;
}
.strength-fill {
  height: 100%;
  border-radius: 999px;
}
.strength-card[data-region="南部"] .strength-fill {
  background: linear-gradient(90deg, rgba(213, 98, 67, 0.58), rgba(213, 98, 67, 0.96));
}
.strength-card[data-region="东部"] .strength-fill {
  background: linear-gradient(90deg, rgba(79, 143, 58, 0.58), rgba(79, 143, 58, 0.96));
}
.strength-card[data-region="北部"] .strength-fill {
  background: linear-gradient(90deg, rgba(27, 132, 166, 0.58), rgba(27, 132, 166, 0.96));
}
.strength-metric .value {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.strength-footer {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: flex;
  gap: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 11px;
}
.ranking-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
}
.ranking-head p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}
.table-wrap {
  min-height: 0;
  overflow: auto;
  margin-top: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
  font-size: 12px;
}
th {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  position: sticky;
  top: 0;
  background: #fff;
}
th.sortable {
  cursor: pointer;
  user-select: none;
}
th.sortable:hover {
  color: var(--ink);
  background: var(--panel-soft);
}
th.sortable.active {
  color: var(--accent);
}
.sort-indicator {
  margin-left: 4px;
  font-size: 9px;
}
td.rank {
  font-size: 18px;
  font-weight: 800;
}
td.score-cell {
  font-size: 16px;
  font-weight: 800;
}
tr.qual-national td { background: rgba(255, 246, 222, 0.68); }
tr.qual-revival td { background: rgba(238, 251, 253, 0.7); }
tr.unsubmitted td { color: var(--muted); }
.shark-stage {
  display: grid;
  gap: 10px;
}
.shark-overview,
.shark-route-card {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 18px;
}
.shark-overview { padding: 14px 16px; }
.shark-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.shark-head h2 {
  margin: 0 0 4px;
  font-size: 17px;
}
.shark-head p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  max-width: 920px;
}
.shark-overview-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}
.shark-mini-card {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  background: linear-gradient(180deg, #ffffff, #f7f9fc);
}
.shark-mini-card h3 {
  margin: 8px 0 4px;
  font-size: 18px;
}
.shark-mini-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.shark-mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.shark-mini-grid.single {
  grid-template-columns: 1fr;
}
.shark-mini-stat {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 9px 10px;
  background: rgba(255, 255, 255, 0.82);
}
.shark-mini-stat .k {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.shark-mini-stat .v {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.1;
}
.shark-mini-stat .hint {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}
.shark-distances {
  margin-top: 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.shark-route-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.shark-route-card {
  padding: 14px;
  display: grid;
  gap: 12px;
  background: linear-gradient(180deg, #ffffff, #f8fafc);
}
.shark-route-card[data-region="南部"] {
  border-color: rgba(213, 98, 67, 0.28);
  background: linear-gradient(180deg, rgba(213, 98, 67, 0.08), #ffffff 55%);

.shark-route-card[data-region="南部"] h3 { color: var(--south); }
.shark-route-card[data-region="东部"] h3 { color: var(--east); }
.shark-route-card[data-region="北部"] h3 { color: var(--north); }
.route-pill-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.route-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 800;
  border: 1px solid var(--line);
  background: #fff;
}
.route-pill.recommended {
  color: var(--accent);
  border-color: rgba(34, 86, 200, 0.24);
  background: rgba(34, 86, 200, 0.08);
}
.route-pill.qual-national {
  color: #8a5f00;
  border-color: rgba(201, 141, 22, 0.22);
  background: rgba(255, 246, 222, 0.92);
}
.route-pill.qual-revival {
  color: #0d6f87;
  border-color: rgba(17, 132, 166, 0.22);
  background: rgba(238, 251, 253, 0.92);
}
.route-pill.qual-none {
  color: #9b3f34;
  border-color: rgba(193, 91, 78, 0.22);
  background: rgba(250, 243, 243, 0.92);
}
.shark-route-summary {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.shark-route-kpis,
.shark-rate-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.shark-kpi,
.shark-rate {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 11px;
  background: rgba(255, 255, 255, 0.82);
}
.shark-kpi span,
.shark-rate span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.shark-kpi strong,
.shark-rate strong {
  display: block;
  margin-top: 6px;
  font-size: 21px;

}

.shark-rate small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}
.shark-route-footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.muted { color: var(--muted); }
footer {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}
@media (max-width: 1200px) {
  .shell { min-height: calc(100vh - 24px); }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .region-grid { grid-template-columns: 1fr; }
  .strength-grid { grid-template-columns: 1fr; }
  .shark-overview-grid,
  .shark-route-grid { grid-template-columns: 1fr; }
  .strength-mini-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .formula-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #panel-advancement.active,
  #panel-strength.active,
  #panel-region-strength.active,
  #panel-shark-decision.active { overflow: visible; }
  .region-card,
  .ranking-card { min-height: auto; }
  .member-list,
  .table-wrap { overflow: visible; }
}
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spot-strip,
  .formula-grid,
  .shark-route-kpis,
  .shark-rate-grid { grid-template-columns: 1fr; }
  .strength-mini-grid { grid-template-columns: 1fr; }
  .shark-mini-grid { grid-template-columns: 1fr; }
  .strength-metric { grid-template-columns: 64px 1fr auto; }

  .member-side { text-align: left; }
  .tabs { width: 100%; display: flex; }

}

<body>
<div class="shell">
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="eyebrow"><span class="live-dot"></span>Live Qualification Engine</div>
        <h1>RMUC 2026 晋级推演台</h1>
        <p class="subtitle">页面支持整体滚动；分赛区卡片会按赛区实力顺序展示全部学校。未提交志愿的学校会以灰色卡片显示当前预测结果。</p>
      </div>
      <div class="hero-actions">
        <button id="refreshBtn" class="refresh-btn" type="button">刷新数据</button>
      </div>
    </div>
    <div class="hero-meta">
      <span>更新时间 <strong id="updated">—</strong></span>
      <span id="syncStatus" class="sync-status idle">当前页面显示的是最近一次已生成的数据快照。</span>
      <span class="links">
        <a id="src" href="#" target="_blank" rel="noopener">参赛反馈看板</a>
        <a id="ann" href="#" target="_blank" rel="noopener">公告 1910</a>
        <a href="./data.csv" download>CSV</a>

      </span>
    </div>
  </section>

  <div id="err"></div>
  <div id="stats" class="stats"></div>

  <div class="tabs" role="tablist" aria-label="Dashboard Tabs">

    <button class="tab-btn" data-tab="region-strength" type="button">赛区强度</button>
    <button class="tab-btn" data-tab="strength" type="button">综合实力榜</button>
    <button class="tab-btn" data-tab="shark-decision" type="button">SHARK 决策</button>
  </div>

  <section id="panel-advancement" class="panel active"></section>
  <section id="panel-region-strength" class="panel"></section>
  <section id="panel-strength" class="panel"></section>

  <footer id="footerNote">
    全国赛名额按公告精确计算；复活赛名额为模型推演值。由 GitHub Actions 每 5 分钟自动同步；页面每 60 秒检查新发布数据。
  </footer>
</div>

<script>
const REGION_ORDER = { "南部": 0, "东部": 1, "北部": 2 };
let currentData = null;
const currentHost = window.location.hostname || "";
const POLL_INTERVAL_MS = 60 * 1000;
const MAX_SORT = 10 ** 9;
const QUALIFICATION_ORDER = { national: 0, revival: 1, none: 2 };
const STRENGTH_SORT_DEFAULTS = {
  strength_rank_global: "asc",
  school: "asc",
  assigned: "asc",
  strength_score: "desc",
  rmul_bonus: "desc",
  full_form_score: "desc",
  history_bonus: "desc",
  points_score: "desc",
  qualification_status: "asc",
  is_submitted: "desc",
};
let strengthSortState = {
  key: "strength_rank_global",
  direction: STRENGTH_SORT_DEFAULTS.strength_rank_global,
};

function isPrivateIPv4(host) {
  if (/^10\./.test(host) || /^192\.168\./.test(host)) return true;
  const match = host.match(/^172\.(\d+)\./);
  if (!match) return false;
  const second = Number(match[1]);
  return second >= 16 && second <= 31;
}

function canUseLocalRefresh() {
  return (
    currentHost === "localhost" ||
    currentHost === "127.0.0.1" ||
    currentHost === "::1" ||
    currentHost.endsWith(".local") ||
    isPrivateIPv4(currentHost)
  );
}

const LOCAL_REFRESH_ENABLED = canUseLocalRefresh();

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[ch]));
}

function fmtAgo(iso) {
  const then = new Date(iso);
  const ms = Date.now() - then.getTime();
  const min = Math.floor(ms / 60000);
  if (min < 1) return "刚刚";
  if (min < 60) return `${min} 分钟前`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour} 小时前`;
  return `${Math.floor(hour / 24)} 天前`;
}

function showError(message) {
  const err = document.getElementById("err");
  err.style.display = "block";
  err.textContent = message;
}

function clearError() {
  const err = document.getElementById("err");
  err.style.display = "none";
  err.textContent = "";
}

function qualificationClass(status) {
  return `qual-${status || "none"}`;
}

function numOr(value, fallback = 0) {
  const num = Number(value);
  return Number.isFinite(num) ? num : fallback;
}

function fixedOr(value, digits = 1, fallback = "—") {
  const num = Number(value);
  return Number.isFinite(num) ? num.toFixed(digits) : fallback;
}

function signedOr(value, zeroLabel = "压线", fallback = "—") {
  const num = Number(value);
  if (!Number.isFinite(num)) return fallback;
  if (num === 0) return zeroLabel;
  return `${num > 0 ? "+" : ""}${num}`;
}

function inferSubmitted(member) {
  if (typeof member?.is_submitted === "boolean") return member.is_submitted;
  return member?.volunteer_source === "submitted"
    || member?.volunteer_source_label === "实时提交";
}

function compareNumber(a, b) {
  if (a === b) return 0;
  return a < b ? -1 : 1;
}

function compareText(a, b) {
  return String(a ?? "").localeCompare(String(b ?? ""), "zh-CN");
}

function nullableRank(value) {
  return value == null ? MAX_SORT : numOr(value, MAX_SORT);
}

function componentScore(team, key) {
  return numOr(team?.strength_components?.[key], 0);
}

function compareRegionMembers(a, b) {
  return compareNumber(nullableRank(a?.strength_rank_region), nullableRank(b?.strength_rank_region))
    || compareNumber(nullableRank(a?.strength_rank_global), nullableRank(b?.strength_rank_global))
    || compareNumber(numOr(b?.strength_score, -1), numOr(a?.strength_score, -1))
    || compareText(a?.school, b?.school);
}

function compareStrengthTeams(a, b, key, direction) {
  let cmp = 0;
  if (key === "school") {
    cmp = compareText(a.school, b.school);
  } else if (key === "assigned") {
    cmp = compareNumber(numOr(REGION_ORDER[a.assigned], 9), numOr(REGION_ORDER[b.assigned], 9));
  } else if (key === "strength_score") {
    cmp = compareNumber(numOr(a.strength_score, 0), numOr(b.strength_score, 0));
  } else if (key === "rmul_bonus") {
    cmp = compareNumber(componentScore(a, "rmul_bonus"), componentScore(b, "rmul_bonus"));
  } else if (key === "full_form_score") {
    cmp = compareNumber(componentScore(a, "full_form_score"), componentScore(b, "full_form_score"));
  } else if (key === "history_bonus") {
    cmp = compareNumber(componentScore(a, "history_bonus"), componentScore(b, "history_bonus"));
  } else if (key === "points_score") {
    cmp = compareNumber(componentScore(a, "points_score"), componentScore(b, "points_score"));
  } else if (key === "qualification_status") {
    cmp = compareNumber(
      numOr(QUALIFICATION_ORDER[a.qualification_status], 9),
      numOr(QUALIFICATION_ORDER[b.qualification_status], 9)
    );
  } else if (key === "is_submitted") {
    cmp = compareNumber(inferSubmitted(a) ? 1 : 0, inferSubmitted(b) ? 1 : 0);
  } else {
    cmp = compareNumber(nullableRank(a.strength_rank_global), nullableRank(b.strength_rank_global));
  }

  if (cmp !== 0) return direction === "desc" ? -cmp : cmp;
  return compareRegionMembers(a, b);
}

function setStrengthSort(key) {
  const defaultDirection = STRENGTH_SORT_DEFAULTS[key] || "asc";
  if (strengthSortState.key === key) {
    strengthSortState.direction = strengthSortState.direction === "asc" ? "desc" : "asc";
  } else {
    strengthSortState = { key, direction: defaultDirection };
  }
  if (currentData) renderStrength(currentData);
}

function sortIndicator(key) {
  if (strengthSortState.key !== key) return "↕";
  return strengthSortState.direction === "asc" ? "↑" : "↓";
}

function sortableHeader(label, key) {
  const active = strengthSortState.key === key ? "active" : "";
  return `<th class="sortable ${active}" data-sort="${key}">${esc(label)}<span class="sort-indicator">${sortIndicator(key)}</span></th>`;
}

function normalizeRegion(region = {}) {
  const primaryMembers = Array.isArray(region.members) ? region.members : [];
  const hiddenMembers = Array.isArray(region.hidden_members) ? region.hidden_members : [];
  const dedupedMembers = [];
  const seenSchools = new Set();
  [...primaryMembers, ...hiddenMembers].forEach((member) => {
    if (!member?.school || seenSchools.has(member.school)) return;
    seenSchools.add(member.school);
    dedupedMembers.push(member);
  });
  const combinedMembers = dedupedMembers.sort(compareRegionMembers);
  const submittedCount = combinedMembers.filter((member) => inferSubmitted(member)).length;
  const estimatedCount = combinedMembers.length - submittedCount;
  const counts = region?.counts ? {
    host: numOr(region.counts.host),
    volunteer: numOr(region.counts.volunteer),
    transfer: numOr(region.counts.transfer),
  } : combinedMembers.reduce((acc, member) => {
    const key = member?.status;
    if (key && Object.prototype.hasOwnProperty.call(acc, key)) acc[key] += 1;
    return acc;
  }, { host: 0, volunteer: 0, transfer: 0 });
  return {
    ...region,
    count: numOr(region.count, combinedMembers.length),
    visible_count: numOr(region.visible_count, combinedMembers.length),
    hidden_count: numOr(region.hidden_count, estimatedCount),
    submitted_count: numOr(region.submitted_count, submittedCount),
    estimated_count: numOr(region.estimated_count, estimatedCount),
    members: combinedMembers,
    hidden_members: hiddenMembers,
    counts,
  };
}

function normalizeSummary(summary = {}, region = {}) {
  return {
    ...summary,
    national_spots: numOr(summary.national_spots, numOr(region.national_spots)),
    revival_spots: numOr(summary.revival_spots, numOr(region.revival_spots)),
    top16_count: numOr(summary.top16_count, numOr(region.top16_count)),
    floating_spots: numOr(summary.floating_spots, numOr(region.floating_spots)),
    advancing_total: numOr(
      summary.advancing_total,
      numOr(
        region.advancing_total,
        numOr(summary.national_spots, numOr(region.national_spots))
          + numOr(summary.revival_spots, numOr(region.revival_spots))
      )
    ),
  };
}

function normalizeStrengthStats(stats = {}) {
  return {
    team_count: numOr(stats.team_count),
    avg_strength_score: numOr(stats.avg_strength_score),
    median_strength_score: numOr(stats.median_strength_score),
    stdev_strength_score: numOr(stats.stdev_strength_score),
    top8_avg_strength_score: numOr(stats.top8_avg_strength_score),
    min_strength_score: numOr(stats.min_strength_score),
    max_strength_score: numOr(stats.max_strength_score),
    q1_strength_score: numOr(stats.q1_strength_score),
    q3_strength_score: numOr(stats.q3_strength_score),
    iqr_strength_score: numOr(stats.iqr_strength_score),
  };
}

function metricPercent(value, minValue, maxValue, higherBetter = true) {
  if (maxValue <= minValue) return 100;
  const raw = higherBetter
    ? (value - minValue) / (maxValue - minValue)
    : (maxValue - value) / (maxValue - minValue);
  return Math.max(12, Math.min(100, 12 + raw * 88));
}

function normalizeDecisionResult(result = {}) {
  return {
    ...result,
    shark_volunteer: result.shark_volunteer || "",
    final_region: result.final_region || "—",
    status: result.status || "",
    status_cn: result.status_cn || result.status || "—",
    qualification_status: result.qualification_status || "none",
    qualification_label: result.qualification_label || "未晋级",
    strength_score: numOr(result.strength_score),
    strength_rank_global: result.strength_rank_global ?? null,
    strength_rank_region: result.strength_rank_region ?? null,
    ff_position: result.ff_position ?? null,
    national_spots: numOr(result.national_spots),
    revival_spots: numOr(result.revival_spots),
    national_margin: result.national_margin,
    advance_margin: result.advance_margin,
    national_line_school: result.national_line_school || null,
    advance_line_school: result.advance_line_school || null,
    first_out_school: result.first_out_school || null,
    national_gap_score: result.national_gap_score,
    advance_gap_score: result.advance_gap_score,
    decision_score: numOr(result.decision_score),
    decision_components: result.decision_components || {},
    summary: result.summary || "",
    region_strength_stats: result.region_strength_stats || {},
  };
}

function normalizeSharkDecision(decision) {
  if (!decision) return null;
  return {
    model_note: decision.model_note || "",
    model_weights: decision.model_weights || {},
    target: decision.target || {},
    same_city_rival: decision.same_city_rival || null,
    observed_state: decision.observed_state || {},
    options: [...(decision.options || [])]
      .map((option) => normalizeDecisionResult(option))
      .sort((a, b) => compareNumber(
        numOr(REGION_ORDER[a.shark_volunteer], 9),
        numOr(REGION_ORDER[b.shark_volunteer], 9),
      )),
    recommendation: decision.recommendation || {},
  };
}

function renderStats(data) {
  const panel = data.advancement_panel;
  const nationalTotal = Object.values(panel.national_by_region || {}).reduce((sum, v) => sum + v, 0);
  const revivalTotal = Object.values(panel.revival_by_region || {}).reduce((sum, v) => sum + v, 0);
  const cards = [
    ["已提交", data.submission.submitted_count, `当前已填报 ${data.submission.submitted_count} 支学校`],
    ["未提交", data.submission.estimated_count, "灰色卡片展示当前预测结果"],
    ["国赛名额", nationalTotal, "公告精确计算"],
    ["复活赛推演", revivalTotal, "模型推演结果"],
    ["被调剂", data.transferred_count, data.adjustment_order.length ? data.adjustment_order.join(" → ") : "当前无需调剂"],
    ["权益院校", data.hosts_seen, "RMUC + RMUL 志愿优先录取"],
  ];
  document.getElementById("stats").innerHTML = cards.map(([label, value, hint]) => `
    <div class="stat">
      <div class="label">${esc(label)}</div>
      <div class="value">${esc(value)}</div>
      <div class="hint">${esc(hint)}</div>
    </div>
  `).join("");
}

function renderRegionCard(region, summary) {
  const safeRegion = normalizeRegion(region);
  const safeSummary = normalizeSummary(summary, safeRegion);
  const strengthStats = normalizeStrengthStats(safeSummary.strength_stats || safeRegion.strength_stats);
  const members = safeRegion.members || [];
  const visibleList = members.length ? members.map((member) => {
    const boundary = (member.boundary_markers || []).length > 0;
    const submitted = inferSubmitted(member);
    const flowClass = member.status === "host" ? "flow-host" : member.status === "transfer" ? "flow-transfer" : "flow-volunteer";
    const boundaryBadges = (member.boundary_labels || []).map((label) =>
      `<span class="badge boundary">${esc(label)}</span>`
    ).join("");
    const submitBadge = submitted
      ? `<span class="badge submit-live">已填报</span>`
      : `<span class="badge submit-prediction">预测</span>`;
    const volunteerText = submitted
      ? `志愿 ${esc(member.original_volunteer)}`
      : `预测志愿 ${esc(member.original_volunteer)} (${esc(member.volunteer_source_label)})`;
    return `
      <li class="member ${qualificationClass(member.qualification_status)} ${submitted ? "" : "unsubmitted"} ${boundary ? "boundary" : ""}">
        <div class="member-main">
          <div class="member-title">
            <span class="school">${esc(member.school)}</span>
            <span class="team">${esc(member.team)}</span>
            <span class="badge ${qualificationClass(member.qualification_status)}">${esc(member.qualification_label)}</span>
            ${submitBadge}
            <span class="badge ${flowClass}">${esc(member.status_cn)}</span>
            ${boundaryBadges}
          </div>
          <div class="member-sub">
            ${esc(member.city)} · ${esc(member.team_type)} · 赛区 #${member.strength_rank_region ?? "—"} / 全局 #${member.strength_rank_global ?? "—"}
            · ${volunteerText} · 积分 #${member.rank ?? "—"} · 完整 #${member.full_form_ranking ?? "—"}
            · 2025 ${esc(member.detail_2025_cn || "—")} · RMUL ${esc(member.rmul_2026_top4_cn || "—")}
          </div>
        </div>
        <div class="member-side">
          <div class="score">${fixedOr(member.strength_score)}</div>
          <div class="score-label">${member.dist_km != null ? `${esc(member.dist_km)} km` : "—"}</div>
        </div>
      </li>
    `;
  }).join("") : `<div class="empty">当前没有学校数据。</div>`;

  return `
    <article class="region-card" data-region="${esc(safeRegion.key)}">
      <div class="region-head">
        <div>
          <h3>${esc(safeRegion.name)}</h3>
          <div class="city">${esc(safeRegion.city)}</div>
        </div>
        <div class="region-count">
          ${safeRegion.count}
          <span>已提交 ${safeRegion.submitted_count} / 预测 ${safeRegion.estimated_count}</span>
        </div>
      </div>
      <div class="spot-strip">
        <div class="spot-box national">
          <div class="k">国赛名额</div>
          <div class="v">${safeSummary.national_spots}</div>
        </div>
        <div class="spot-box revival">
          <div class="k">复活赛推演</div>

function renderRegionStrength(data) {
  const panel = data.advancement_panel || {};
  const regions = [...(data.regions || [])]
    .map((region) => normalizeRegion(region))
    .sort((a, b) => REGION_ORDER[a.key] - REGION_ORDER[b.key]);
  const regionByKey = Object.fromEntries(regions.map((region) => [region.key, region]));
  const summaries = [...(panel.region_summaries || [])]
    .map((summary) => {
      const region = regionByKey[summary.key] || {};
      return {
        ...summary,
        region,
        strength_stats: normalizeStrengthStats(summary.strength_stats || region.strength_stats),
      };
    })
    .sort((a, b) => (
      numOr(b.strength_stats.avg_strength_score) - numOr(a.strength_stats.avg_strength_score)
      || REGION_ORDER[a.key] - REGION_ORDER[b.key]
    ));

  const avgValues = summaries.map((summary) => summary.strength_stats.avg_strength_score);
  const medianValues = summaries.map((summary) => summary.strength_stats.median_strength_score);
  const top8Values = summaries.map((summary) => summary.strength_stats.top8_avg_strength_score);
  const stdevValues = summaries.map((summary) => summary.strength_stats.stdev_strength_score);
  const avgMin = Math.min(...avgValues, 0);
  const avgMax = Math.max(...avgValues, 0);
  const medianMin = Math.min(...medianValues, 0);
  const medianMax = Math.max(...medianValues, 0);
  const top8Min = Math.min(...top8Values, 0);
  const top8Max = Math.max(...top8Values, 0);
  const stdevMin = Math.min(...stdevValues, 0);
  const stdevMax = Math.max(...stdevValues, 0);
  const strongestAvg = summaries[0];
  const strongestTop8 = [...summaries].sort((a, b) => (
    numOr(b.strength_stats.top8_avg_strength_score) - numOr(a.strength_stats.top8_avg_strength_score)
    || REGION_ORDER[a.key] - REGION_ORDER[b.key]
  ))[0];
  const mostStable = [...summaries].sort((a, b) => (
    numOr(a.strength_stats.stdev_strength_score) - numOr(b.strength_stats.stdev_strength_score)
    || REGION_ORDER[a.key] - REGION_ORDER[b.key]
  ))[0];

  const cards = summaries.map((summary, idx) => {
    const stats = summary.strength_stats;
    const region = summary.region || {};
    const metrics = [
      ["均分", stats.avg_strength_score, metricPercent(stats.avg_strength_score, avgMin, avgMax, true)],
      ["中位数", stats.median_strength_score, metricPercent(stats.median_strength_score, medianMin, medianMax, true)],
      ["Top 8", stats.top8_avg_strength_score, metricPercent(stats.top8_avg_strength_score, top8Min, top8Max, true)],
      ["稳定性", stats.stdev_strength_score, metricPercent(stats.stdev_strength_score, stdevMin, stdevMax, false)],
    ];
    return `
      <article class="strength-card" data-region="${esc(summary.key)}">
        <div class="strength-card-top">
          <div>
            <div class="strength-rank">整体强度 #${idx + 1}</div>
            <h3>${esc(summary.name)}</h3>
          </div>
          <div class="strength-lead">
            <div class="v">${fixedOr(stats.avg_strength_score)}</div>
            <div class="k">当前赛区均分</div>
          </div>
        </div>
        <div class="strength-mini-grid">
          <div class="strength-mini">
            <div class="k">中位数</div>
            <div class="v">${fixedOr(stats.median_strength_score)}</div>
          </div>
          <div class="strength-mini">
            <div class="k">Top 8 均分</div>
            <div class="v">${fixedOr(stats.top8_avg_strength_score)}</div>
          </div>
          <div class="strength-mini">
            <div class="k">标准差</div>
            <div class="v">${fixedOr(stats.stdev_strength_score, 2)}</div>
          </div>
          <div class="strength-mini">
            <div class="k">IQR</div>
            <div class="v">${fixedOr(stats.iqr_strength_score, 2)}</div>
          </div>
        </div>
        <div class="strength-metrics">
          ${metrics.map(([label, value, percent]) => `
            <div class="strength-metric">
              <span class="label">${esc(label)}</span>
              <div class="strength-track">
                <div class="strength-fill" style="width:${fixedOr(percent, 1, "0.0")}%"></div>
              </div>
              <span class="value">${fixedOr(value, label === "稳定性" ? 2 : 1)}</span>
            </div>
          `).join("")}
        </div>
        <div class="strength-footer">
          <span>区间 ${fixedOr(stats.min_strength_score)} - ${fixedOr(stats.max_strength_score)}</span>
          <span>已提交 ${numOr(region.submitted_count)} / 预测 ${numOr(region.estimated_count)}</span>
        </div>
      </article>
    `;
  }).join("");

  document.getElementById("panel-region-strength").innerHTML = `
    <section class="strength-stage">
      <div class="strength-stage-head">
        <div>
          <h2>赛区强度剖面</h2>
          <p>基于当前录取结果统计 32 支队伍的综合实力分。均分和中位数看整体厚度，Top 8 均分看头部竞争力，标准差越低说明赛区内部越整齐。</p>
        </div>
        <div class="pill-row">
          <span class="pill"><strong>整体均分领先</strong>${strongestAvg ? `${esc(strongestAvg.name)} ${fixedOr(strongestAvg.strength_stats.avg_strength_score)}` : "—"}</span>
          <span class="pill"><strong>头部最强</strong>${strongestTop8 ? `${esc(strongestTop8.name)} ${fixedOr(strongestTop8.strength_stats.top8_avg_strength_score)}` : "—"}</span>
          <span class="pill"><strong>最稳定</strong>${mostStable ? `${esc(mostStable.name)} ${fixedOr(mostStable.strength_stats.stdev_strength_score, 2)}` : "—"}</span>
        </div>
      </div>
      <div class="strength-grid">${cards}</div>
    </section>
  `;
}

              ${sortableHeader("预测赛区", "assigned")}
              ${sortableHeader("综合分", "strength_score")}
              ${sortableHeader("RMUL", "rmul_bonus")}
              ${sortableHeader("完整形态", "full_form_score")}
              ${sortableHeader("2025 战绩", "history_bonus")}
              ${sortableHeader("积分修正", "points_score")}
              ${sortableHeader("资格", "qualification_status")}
              ${sortableHeader("志愿状态", "is_submitted")}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
  `;

  panel.querySelectorAll("th.sortable").forEach((th) => {
    th.addEventListener("click", () => setStrengthSort(th.dataset.sort));
  });
}

function renderMeta(data) {
  document.getElementById("updated").textContent = `${data.updated_at_cst} CST · ${fmtAgo(data.updated_at_utc)}`;
  document.getElementById("src").href = data.source.board;
  document.getElementById("ann").href = data.source.announcement;
  const meta = data.refresh_meta || {};
  const sync = document.getElementById("syncStatus");
  const status = meta.status || "idle";
  sync.className = `sync-status ${status}`;
  sync.textContent = meta.message || `当前页面显示的是 ${data.updated_at_cst} 的已生成数据。`;
}

function render(data) {
  currentData = data;
  renderMeta(data);
  renderStats(data);
  renderAdvancement(data);
  renderRegionStrength(data);
  renderStrength(data);
  renderSharkDecision(data);
  if (data.fetch_error) {
    showError(`抓取失败：${data.fetch_error}`);
  } else {
    clearError();
  }
}

function setTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });
  document.querySelectorAll(".panel").forEach((panel) => {
    panel.classList.toggle("active", panel.id === `panel-${tab}`);
  });
}

function updateRuntimeHints() {
  const button = document.getElementById("refreshBtn");
  const footer = document.getElementById("footerNote");
  if (LOCAL_REFRESH_ENABLED) {
    button.hidden = false;
    footer.textContent = "全国赛名额按公告精确计算；复活赛名额为模型推演值。当前为本地模式，可点击刷新直接抓取轻流；页面每 60 秒检查 data.json 更新。";
    return;
  }
  button.hidden = true;
  footer.textContent = "全国赛名额按公告精确计算；复活赛名额为模型推演值。由 GitHub Actions 每 5 分钟自动同步；页面每 60 秒检查新发布数据。";
}

async function loadData() {
  const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function refreshPublishedData(force = false) {
  const payload = await loadData();
  if (force || !currentData || payload.updated_at_utc !== currentData.updated_at_utc) {
    render(payload);
  }
}

async function refreshData() {
  if (!LOCAL_REFRESH_ENABLED) return;
  const button = document.getElementById("refreshBtn");
  const previous = button.textContent;
  button.disabled = true;
  button.textContent = "刷新中...";
  try {
    const res = await fetch("./api/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
      cache: "no-store"
    });
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
    render(payload);
  } catch (error) {
    const suffix = currentData
      ? `（已保留上次成功数据：${currentData.updated_at_cst} CST）`
      : "";
    showError(`刷新失败：${error.message}${suffix}`);
  } finally {
    button.disabled = false;
    button.textContent = previous;
  }
}

updateRuntimeHints();
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => setTab(btn.dataset.tab));
});
if (LOCAL_REFRESH_ENABLED) {
  document.getElementById("refreshBtn").addEventListener("click", refreshData);
}

(async () => {
  try {
    await refreshPublishedData(true);
  } catch (error) {
    document.getElementById("panel-advancement").innerHTML = `<div class="empty">数据加载失败：${esc(error.message)}</div>`;
    document.getElementById("panel-region-strength").innerHTML = `<div class="empty">当前尚未发布 data.json。</div>`;
    document.getElementById("panel-strength").innerHTML = `<div class="empty">当前尚未发布 data.json。</div>`;
    document.getElementById("panel-shark-decision").innerHTML = `<div class="empty">当前尚未发布 SHARK 决策数据。</div>`;
    showError(`初始加载失败：${error.message}`);
  }
})();

setInterval(async () => {
  try {
    await refreshPublishedData(false);
  } catch (error) {
    console.warn("auto refresh failed:", error);
  }
}, POLL_INTERVAL_MS);
</script>
</body>
</html>
