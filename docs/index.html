<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMUC 2026 晋级推演台</title>
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --panel-soft: #f7f8fa;
  --panel-muted: #f2f4f7;
  --line: #e6ebf2;
  --line-strong: #d7dfeb;
  --ink: #172033;
  --muted: #71809a;
  --accent: #2256c8;
  --gold-bg: #fff6de;
  --gold-line: #edc76e;
  --cyan-bg: #eefbfd;
  --cyan-line: #9ed7df;
  --rose-bg: #faf3f3;
  --rose-line: #e9d2d2;
  --south: #d56243;
  --east: #4f8f3a;
  --north: #1b84a6;
  --shadow: 0 12px 28px rgba(24, 38, 73, 0.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 12px;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; }
.shell {
  max-width: 1600px;
  min-height: calc(100vh - 24px);
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto auto auto auto 1fr auto;
  gap: 10px;
}
.hero,
.banner,
.formula-card,
.ranking-card,
.region-card,
.stat,
#err {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero {
  border-radius: 18px;
  padding: 14px 18px 12px;
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.eyebrow {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: #30a46c;
}
h1 {
  margin: 8px 0 4px;
  font-size: 28px;
  line-height: 1.05;
}
.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  max-width: 900px;
}
.hero-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.refresh-btn {
  border: none;
  border-radius: 999px;
  padding: 9px 16px;
  background: linear-gradient(135deg, #2256c8, #1b459c);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.refresh-btn[disabled] {
  opacity: 0.72;
  cursor: progress;
}
.hero-meta {
  display: flex;
  gap: 10px 14px;
  flex-wrap: wrap;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}
.hero-meta .links {
  display: inline-flex;
  gap: 10px;
}
.sync-status {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 11px;
}
.sync-status.success {
  background: rgba(48, 164, 108, 0.08);
  border-color: rgba(48, 164, 108, 0.22);
  color: #1f7a50;
}
.sync-status.error {
  background: rgba(193, 91, 78, 0.08);
  border-color: rgba(193, 91, 78, 0.2);
  color: #a13c3c;
}
.sync-status.idle {
  background: rgba(34, 86, 200, 0.06);
  border-color: rgba(34, 86, 200, 0.16);
  color: #355ea6;
}
#err {
  display: none;
  border-radius: 14px;
  padding: 10px 12px;
  color: #a13c3c;
  background: #fff5f5;
  border-color: #f0d6d6;
}
.stats {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}
.stat {
  border-radius: 16px;
  padding: 10px 12px;
}
.stat .label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.stat .value {
  margin-top: 6px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1;
}
.stat .hint {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}
.tabs {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-soft);
  width: fit-content;
}
.tab-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.tab-btn.active {
  color: var(--accent);
  background: #ffffff;
  box-shadow: 0 6px 14px rgba(24, 38, 73, 0.08);
}
.panel {
  display: none;
  min-height: 0;
}
#panel-advancement.active,
#panel-global-swiss.active,
#panel-strength.active,
#panel-region-strength.active,
#panel-shark-decision.active,
#panel-swiss-simulation.active {
  display: grid;
  gap: 10px;
  overflow: hidden;
}
#panel-advancement.active {
  grid-template-rows: auto 1fr;
}
#panel-global-swiss.active,
#panel-strength.active,
#panel-region-strength.active {
  grid-template-rows: auto 1fr;
}
#panel-shark-decision.active {
  grid-template-rows: auto;
}
#panel-swiss-simulation.active {
  grid-template-rows: auto;
}
.banner,
.formula-card,
.ranking-card {
  border-radius: 18px;
  padding: 12px 16px;
}
.banner {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.banner h2,
.formula-card h2,
.ranking-card h2 {
  margin: 0 0 4px;
  font-size: 17px;
}
.banner p,
.formula-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.banner-main {
  display: grid;
  gap: 10px;
  width: 100%;
}
.analysis-toolbar {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.analysis-select-wrap {
  display: grid;
  gap: 4px;
  min-width: min(360px, 100%);
}
.analysis-select-wrap label {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.analysis-select {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  padding: 10px 12px;
  font: inherit;
  color: var(--ink);
  background: #fff;
}
.pill-row,
.meta-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 11px;
  color: var(--muted);
  background: var(--panel-soft);
  border: 1px solid var(--line);
}
.pill strong { color: var(--ink); }
.region-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  align-items: stretch;
}
.region-card {
  min-height: 0;
  min-block-size: clamp(520px, 62vh, 760px);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.region-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 8px;
}
.region-head h3 {
  margin: 0;
  font-size: 22px;
}
.region-card[data-region="南部"] h3 { color: var(--south); }
.region-card[data-region="东部"] h3 { color: var(--east); }
.region-card[data-region="北部"] h3 { color: var(--north); }
.city {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}
.region-count {
  text-align: right;
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
}
.region-count span {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.spot-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 8px;
}
.spot-box {
  border-radius: 14px;
  padding: 10px 10px 8px;
  border: 1px solid var(--line);
}
.spot-box.national { background: var(--gold-bg); border-color: var(--gold-line); }
.spot-box.revival { background: var(--cyan-bg); border-color: var(--cyan-line); }
.spot-box.total { background: var(--panel-soft); }
.spot-box .k {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.spot-box .v {
  margin-top: 4px;
  font-size: 19px;
  font-weight: 800;
}
.mini-table {
  display: grid;
  gap: 4px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.mini-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
}
.mini-row strong {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.member-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0 2px 0 0;
  display: grid;
  gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  overflow-y: auto;
}
.member {
  border-radius: 14px;
  border: 1px solid var(--line);
  padding: 8px 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  align-items: center;
}
.member.qual-national { background: var(--gold-bg); border-color: var(--gold-line); }
.member.qual-revival { background: var(--cyan-bg); border-color: var(--cyan-line); }
.member.qual-none { background: var(--rose-bg); border-color: var(--rose-line); }
.member.boundary {
  box-shadow: 0 0 0 2px rgba(34, 86, 200, 0.08);
}
.member.choice-suboptimal {
  border-color: rgba(191, 136, 54, 0.34);
}
.member.choice-adjusted_to_optimal {
  box-shadow: 0 0 0 1px rgba(113, 128, 154, 0.14);
}
.member.metric-positive-high {
  background: linear-gradient(180deg, rgba(36, 133, 170, 0.12), rgba(239, 251, 255, 0.98));
  border-color: rgba(36, 133, 170, 0.28);
}
.member.metric-positive-mid {
  background: linear-gradient(180deg, rgba(72, 160, 191, 0.1), rgba(244, 251, 254, 0.98));
  border-color: rgba(72, 160, 191, 0.22);
}
.member.metric-positive-low {
  background: linear-gradient(180deg, rgba(214, 177, 113, 0.1), rgba(255, 249, 239, 0.98));
  border-color: rgba(214, 177, 113, 0.24);
}
.member.metric-positive-risk {
  background: linear-gradient(180deg, rgba(203, 120, 110, 0.1), rgba(255, 245, 244, 0.98));
  border-color: rgba(203, 120, 110, 0.24);
}
.member.metric-revival-heavy {
  background: linear-gradient(180deg, rgba(201, 141, 22, 0.12), rgba(255, 248, 236, 0.98));
  border-color: rgba(201, 141, 22, 0.26);
}
.member.metric-revival-mid {
  background: linear-gradient(180deg, rgba(214, 167, 69, 0.11), rgba(255, 250, 242, 0.98));
  border-color: rgba(214, 167, 69, 0.24);
}
.member.metric-revival-low {
  background: linear-gradient(180deg, rgba(137, 149, 170, 0.1), rgba(247, 249, 252, 0.98));
  border-color: rgba(137, 149, 170, 0.22);
}
.member.metric-revival-thin {
  background: linear-gradient(180deg, rgba(94, 128, 171, 0.08), rgba(244, 248, 253, 0.98));
  border-color: rgba(94, 128, 171, 0.2);
}
.member.metric-risk-high {
  background: linear-gradient(180deg, rgba(193, 91, 78, 0.14), rgba(255, 242, 241, 0.98));
  border-color: rgba(193, 91, 78, 0.28);
}
.member.metric-risk-mid {
  background: linear-gradient(180deg, rgba(222, 146, 84, 0.12), rgba(255, 247, 240, 0.98));
  border-color: rgba(222, 146, 84, 0.25);
}
.member.metric-risk-low {
  background: linear-gradient(180deg, rgba(162, 171, 186, 0.1), rgba(247, 249, 252, 0.98));
  border-color: rgba(162, 171, 186, 0.22);
}
.member.metric-risk-safe {
  background: linear-gradient(180deg, rgba(70, 148, 132, 0.1), rgba(242, 251, 248, 0.98));
  border-color: rgba(70, 148, 132, 0.22);
}
.member-main {
  min-width: 0;
}
.member-title {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.member-title .school {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
}
.member-title .team {
  font-size: 10px;
  color: var(--muted);
}
.member-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}
.member-side {
  text-align: right;
  white-space: nowrap;
}
.score {
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
}
.score-kicker {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.score-label {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
}
.score-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.badge.qual-national { background: rgba(201, 141, 22, 0.16); color: #8a5f00; }
.badge.qual-revival { background: rgba(17, 132, 166, 0.12); color: #0d6f87; }
.badge.qual-none { background: rgba(193, 91, 78, 0.12); color: #9b3f34; }
.badge.flow-host { background: rgba(201, 141, 22, 0.14); color: #8a5f00; }
.badge.flow-volunteer { background: rgba(34, 86, 200, 0.1); color: var(--accent); }
.badge.flow-transfer { background: rgba(193, 91, 78, 0.12); color: #9b3f34; }
.badge.boundary { background: #ffffff; color: var(--ink); border: 1px solid var(--line-strong); }
.badge.submit-live { background: rgba(34, 86, 200, 0.08); color: var(--accent); }
.badge.submit-prediction { background: rgba(113, 128, 154, 0.16); color: #5f6c81; }
.badge.choice-suboptimal {
  background: rgba(191, 136, 54, 0.12);
  color: #8a5f00;
  border: 1px solid rgba(191, 136, 54, 0.24);
}
.badge.choice-adjusted_to_optimal {
  background: rgba(113, 128, 154, 0.08);
  color: #67758b;
  border: 1px solid rgba(113, 128, 154, 0.18);
}
.badge.metric-neutral {
  background: rgba(255, 255, 255, 0.84);
  color: #51617a;
  border: 1px solid rgba(113, 128, 154, 0.22);
}
.badge.metric-positive-high {
  background: rgba(36, 133, 170, 0.12);
  color: #14607d;
  border: 1px solid rgba(36, 133, 170, 0.22);
}
.badge.metric-positive-mid {
  background: rgba(72, 160, 191, 0.1);
  color: #2c7188;
  border: 1px solid rgba(72, 160, 191, 0.2);
}
.badge.metric-positive-low {
  background: rgba(214, 177, 113, 0.12);
  color: #8a6725;
  border: 1px solid rgba(214, 177, 113, 0.24);
}
.badge.metric-positive-risk {
  background: rgba(203, 120, 110, 0.12);
  color: #995047;
  border: 1px solid rgba(203, 120, 110, 0.22);
}
.badge.metric-revival-heavy {
  background: rgba(201, 141, 22, 0.12);
  color: #8a5f00;
  border: 1px solid rgba(201, 141, 22, 0.22);
}
.badge.metric-revival-mid {
  background: rgba(214, 167, 69, 0.12);
  color: #8f6a1c;
  border: 1px solid rgba(214, 167, 69, 0.22);
}
.badge.metric-revival-low {
  background: rgba(137, 149, 170, 0.12);
  color: #627086;
  border: 1px solid rgba(137, 149, 170, 0.2);
}
.badge.metric-revival-thin {
  background: rgba(94, 128, 171, 0.1);
  color: #496688;
  border: 1px solid rgba(94, 128, 171, 0.2);
}
.badge.metric-risk-high {
  background: rgba(193, 91, 78, 0.14);
  color: #a13c3c;
  border: 1px solid rgba(193, 91, 78, 0.22);
}
.badge.metric-risk-mid {
  background: rgba(222, 146, 84, 0.12);
  color: #9a5a21;
  border: 1px solid rgba(222, 146, 84, 0.22);
}
.badge.metric-risk-low {
  background: rgba(162, 171, 186, 0.12);
  color: #67758b;
  border: 1px solid rgba(162, 171, 186, 0.2);
}
.badge.metric-risk-safe {
  background: rgba(70, 148, 132, 0.12);
  color: #2e7567;
  border: 1px solid rgba(70, 148, 132, 0.22);
}
.choice-note {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.35;
}
.member.choice-suboptimal .choice-note {
  color: #8b6332;
}
.member.choice-adjusted_to_optimal .choice-note {
  color: #6f7a8b;
}
.member.unsubmitted,
.member.unsubmitted.qual-national,
.member.unsubmitted.qual-revival,
.member.unsubmitted.qual-none {
  background: #f4f6f9;
  border-color: #d9dfe8;
}
.member.unsubmitted .member-title .school,
.member.unsubmitted .score {
  color: #556279;
}
.member.unsubmitted .member-sub,
.member.unsubmitted .score-label,
.member.unsubmitted .score-kicker,
.member.unsubmitted .score-sub,
.member.unsubmitted .member-title .team {
  color: #8a96a8;
}
.hidden-block {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel-muted);
  color: var(--muted);
}
.hidden-block summary {
  cursor: pointer;
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 700;
  list-style: none;
}
.hidden-block summary::-webkit-details-marker { display: none; }
.hidden-list {
  border-top: 1px solid var(--line);
  padding: 6px 10px 8px;
  display: grid;
  gap: 5px;
}
.hidden-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
}
.hidden-item .name {
  color: #4f5d74;
  font-weight: 700;
}
.empty {
  padding: 18px 12px;
  text-align: center;
  color: var(--muted);
  background: var(--panel-soft);
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  font-size: 12px;
}
.formula-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.formula-item {
  border: 1px solid var(--line);
  background: var(--panel-soft);
  border-radius: 14px;
  padding: 10px 12px;
}
.formula-item .title {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.formula-item .formula {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
}
.ranking-card {
  min-height: 0;
  min-block-size: clamp(560px, 64vh, 860px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.strength-stage {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 18px;
  padding: 14px 16px;
}
.strength-stage-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.strength-stage-head h2 {
  margin: 0 0 4px;
  font-size: 17px;
}
.strength-stage-head p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  max-width: 920px;
}
.strength-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.strength-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  display: grid;
  gap: 12px;
  background: linear-gradient(180deg, #ffffff, #f7f9fc);
}
.strength-card[data-region="南部"] {
  border-color: rgba(213, 98, 67, 0.28);
  background: linear-gradient(180deg, rgba(213, 98, 67, 0.08), #ffffff 55%);
}
.strength-card[data-region="南部"] h3 { color: var(--south); }
.strength-card[data-region="东部"] {
  border-color: rgba(79, 143, 58, 0.28);
  background: linear-gradient(180deg, rgba(79, 143, 58, 0.08), #ffffff 55%);
}

}

}

.gs-flow-line.advance {
  stroke: rgba(255, 191, 73, 0.94);
}
.gs-flow-line.lose,
.gs-flow-line.eliminated {
  stroke: rgba(88, 167, 215, 0.88);
}
.gs-flow-section {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 12px;
}
.gs-flow-section-head {
  display: flex;

.gs-flow-column {

.gs-flow-column-title {

footer {

  .gs-flow-viewport {
    min-height: auto;
    max-height: none;
  }
}
</style>
</head>
<body>
<div class="shell">
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="eyebrow"><span class="live-dot"></span>Live Qualification Engine</div>
        <h1>RMUC 2026 晋级推演台</h1>
        <p class="subtitle">页面支持整体滚动；首页看板可在纯实力分与多种瑞士轮概率口径之间切换。未提交志愿的学校会以灰色卡片显示当前预测结果。</p>
      </div>
      <div class="hero-actions">
        <button id="refreshBtn" class="refresh-btn" type="button">刷新数据</button>
      </div>
    </div>
    <div class="hero-meta">
      <span>更新时间 <strong id="updated">—</strong></span>
      <span id="syncStatus" class="sync-status idle">当前页面显示的是最近一次已生成的数据快照。</span>
      <span class="links">
        <a id="src" href="#" target="_blank" rel="noopener">参赛反馈看板</a>
        <a id="ann" href="#" target="_blank" rel="noopener">公告 1910</a>
        <a href="./data.csv" download>CSV</a>
        <a href="./data.json" target="_blank" rel="noopener">JSON</a>
      </span>
    </div>
  </section>

  <div id="err"></div>
  <div id="stats" class="stats"></div>

  <div class="tabs" role="tablist" aria-label="Dashboard Tabs">
    <button class="tab-btn active" data-tab="advancement" type="button">晋级推演台</button>
    <button class="tab-btn" data-tab="global-swiss" type="button">全局瑞士轮</button>
    <button class="tab-btn" data-tab="swiss-simulation" type="button">瑞士轮模拟</button>
    <button class="tab-btn" data-tab="region-strength" type="button">赛区强度</button>
    <button class="tab-btn" data-tab="strength" type="button">综合实力榜</button>
    <button class="tab-btn" data-tab="shark-decision" type="button">志愿决策</button>
  </div>

  <section id="panel-advancement" class="panel active"></section>
  <section id="panel-global-swiss" class="panel"></section>
  <section id="panel-swiss-simulation" class="panel"></section>
  <section id="panel-region-strength" class="panel"></section>
  <section id="panel-strength" class="panel"></section>
  <section id="panel-shark-decision" class="panel"></section>

  <footer id="footerNote">
    全国赛名额按公告精确计算；复活赛名额为模型推演值。由 GitHub Actions 每 10 分钟自动同步；页面每 60 秒检查新发布数据。
  </footer>
</div>

<script>
const REGION_ORDER = { "南部": 0, "东部": 1, "北部": 2 };
let currentData = null;
let globalSwissSelectedRegion = "";
let globalSwissZoom = 0;
const globalSwissSampleIndexByRegion = {};
let swissSelectedSchool = "";
let decisionSelectedSchool = "";
let globalSwissSamplesCache = null;
let globalSwissSamplesPromise = null;
let volunteerDecisionCache = null;
let volunteerDecisionPromise = null;
const currentHost = window.location.hostname || "";
const POLL_INTERVAL_MS = 60 * 1000;
const MAX_SORT = 10 ** 9;
const QUALIFICATION_ORDER = { national: 0, revival: 1, none: 2 };
const QUALIFICATION_LABELS = { national: "国赛", revival: "复活赛", none: "未晋级" };
const ADVANCEMENT_ANALYSIS_OPTIONS = [
  { key: "swiss_revival_probability", label: "瑞士轮 · 复活及以上概率", short: "复活及以上", type: "probability", tone: "positive" },
  { key: "swiss_national_probability", label: "瑞士轮 · 国赛概率", short: "国赛概率", type: "probability", tone: "positive" },
  { key: "swiss_top8_probability", label: "瑞士轮 · Top 8 概率", short: "Top 8", type: "probability", tone: "positive" },
  { key: "swiss_top4_probability", label: "瑞士轮 · Top 4 概率", short: "Top 4", type: "probability", tone: "positive" },
  { key: "swiss_revival_only_probability", label: "瑞士轮 · 仅复活概率", short: "仅复活", type: "probability", tone: "revival" },
  { key: "swiss_out_probability", label: "瑞士轮 · 出局概率", short: "出局概率", type: "probability", tone: "risk" },
  { key: "strength_score", label: "纯实力分分析", short: "实力分", type: "strength", tone: "strength" },
];
const ADVANCEMENT_ANALYSIS_BY_KEY = Object.fromEntries(
  ADVANCEMENT_ANALYSIS_OPTIONS.map((entry) => [entry.key, entry])
);
const SWISS_STAGE_ORDER = ["champion", "runner_up", "top4", "top8", "national", "revival", "out"];
const SWISS_STAGE_LABELS = {
  champion: "冠军",
  runner_up: "亚军",
  top4: "四强",
  top8: "八强",
  national: "国赛线",
  revival: "复活线",
  out: "未晋级",
};
const STRENGTH_SORT_DEFAULTS = {
  strength_rank_global: "asc",
  school: "asc",
  assigned: "asc",
  strength_score: "desc",
  rmul_bonus: "desc",
  full_form_score: "desc",
  history_bonus: "desc",
  points_score: "desc",
  qualification_status: "asc",
  is_submitted: "desc",
};
let strengthSortState = {
  key: "strength_rank_global",
  direction: STRENGTH_SORT_DEFAULTS.strength_rank_global,
};
let advancementAnalysisKey = "swiss_revival_probability";

function isPrivateIPv4(host) {
  if (/^10\./.test(host) || /^192\.168\./.test(host)) return true;
  const match = host.match(/^172\.(\d+)\./);
  if (!match) return false;
  const second = Number(match[1]);
  return second >= 16 && second <= 31;
}

function canUseLocalRefresh() {
  return (
    currentHost === "localhost" ||
    currentHost === "127.0.0.1" ||
    currentHost === "::1" ||
    currentHost.endsWith(".local") ||
    isPrivateIPv4(currentHost)
  );
}

const LOCAL_REFRESH_ENABLED = canUseLocalRefresh();

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[ch]));
}

function fmtAgo(iso) {
  const then = new Date(iso);
  const ms = Date.now() - then.getTime();
  const min = Math.floor(ms / 60000);
  if (min < 1) return "刚刚";
  if (min < 60) return `${min} 分钟前`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour} 小时前`;
  return `${Math.floor(hour / 24)} 天前`;
}

function showError(message) {
  const err = document.getElementById("err");
  err.style.display = "block";
  err.textContent = message;
}

function clearError() {
  const err = document.getElementById("err");
  err.style.display = "none";
  err.textContent = "";
}

function qualificationClass(status) {
  return `qual-${status || "none"}`;
}

function qualificationLabel(status) {
  return QUALIFICATION_LABELS[status || "none"] || QUALIFICATION_LABELS.none;
}

function currentAdvancementAnalysis() {
  return ADVANCEMENT_ANALYSIS_BY_KEY[advancementAnalysisKey]
    || ADVANCEMENT_ANALYSIS_OPTIONS[0];
}

function isAdvancementStrengthMode() {
  return currentAdvancementAnalysis().type === "strength";
}

function advancementMetricValue(entry, key = advancementAnalysisKey) {
  if (key === "strength_score") return numOr(entry?.strength_score, -1);
  return numOr(entry?.[key], -1);
}

function advancementMetricDisplay(value, key = advancementAnalysisKey) {
  return key === "strength_score"
    ? fixedOr(value)
    : percentOr(value);
}

function originalQualificationStatus(entry) {
  return entry?.qualification_status || "none";
}

function originalQualificationLabel(entry) {
  return entry?.qualification_label || qualificationLabel(originalQualificationStatus(entry));
}

function numOr(value, fallback = 0) {
  const num = Number(value);
  return Number.isFinite(num) ? num : fallback;
}

function fixedOr(value, digits = 1, fallback = "—") {
  const num = Number(value);
  return Number.isFinite(num) ? num.toFixed(digits) : fallback;
}

function percentOr(value, digits = 1, fallback = "—") {
  const num = Number(value);
  return Number.isFinite(num) ? `${(num * 100).toFixed(digits)}%` : fallback;
}

function signedOr(value, zeroLabel = "压线", fallback = "—") {
  const num = Number(value);
  if (!Number.isFinite(num)) return fallback;
  if (num === 0) return zeroLabel;
  return `${num > 0 ? "+" : ""}${num}`;
}

function signedPercentOr(value, digits = 1, fallback = "—") {
  const num = Number(value);
  if (!Number.isFinite(num)) return fallback;
  if (num === 0) return `${(0).toFixed(digits)}%`;
  return `${num > 0 ? "+" : ""}${(num * 100).toFixed(digits)}%`;
}

function inferSubmitted(member) {
  if (typeof member?.is_submitted === "boolean") return member.is_submitted;
  return member?.volunteer_source === "submitted"
    || member?.volunteer_source_label === "实时提交";
}

function currentQualificationStatus(entry) {
  if (entry?.current_qualification_status) return entry.current_qualification_status;
  const national = Number(entry?.swiss_national_probability);
  const revivalOnly = Number(entry?.swiss_revival_only_probability);
  const out = Number(entry?.swiss_out_probability);
  const hasSwiss = [national, revivalOnly, out].some((value) => Number.isFinite(value));
  if (hasSwiss) {
    const safeNational = Number.isFinite(national) ? national : 0;
    const safeRevivalOnly = Number.isFinite(revivalOnly) ? revivalOnly : 0;
    const safeOut = Number.isFinite(out) ? out : 0;
    if (safeNational >= Math.max(safeRevivalOnly, safeOut)) return "national";
    if (safeRevivalOnly >= safeOut) return "revival";
    return "none";
  }
  return entry?.qualification_status || "none";
}

function currentQualificationLabel(entry) {
  if (entry?.current_qualification_label) return entry.current_qualification_label;
  return qualificationLabel(currentQualificationStatus(entry));
}

function compareNumber(a, b) {
  if (a === b) return 0;
  return a < b ? -1 : 1;
}

function compareText(a, b) {
  return String(a ?? "").localeCompare(String(b ?? ""), "zh-CN");
}

function nullableRank(value) {
  return value == null ? MAX_SORT : numOr(value, MAX_SORT);
}

function componentScore(team, key) {
  return numOr(team?.strength_components?.[key], 0);
}

function compareStrengthRegionMembers(a, b) {
  return compareNumber(nullableRank(a?.strength_rank_region), nullableRank(b?.strength_rank_region))
    || compareNumber(nullableRank(a?.strength_rank_global), nullableRank(b?.strength_rank_global))
    || compareNumber(numOr(b?.strength_score, -1), numOr(a?.strength_score, -1))
    || compareText(a?.school, b?.school);
}

function compareSwissMetricMembers(a, b, key = advancementAnalysisKey) {
  return compareNumber(advancementMetricValue(b, key), advancementMetricValue(a, key))
    || compareNumber(numOr(b?.swiss_revival_probability, -1), numOr(a?.swiss_revival_probability, -1))
    || compareNumber(numOr(b?.swiss_national_probability, -1), numOr(a?.swiss_national_probability, -1))
    || compareNumber(numOr(a?.swiss_average_rank, MAX_SORT), numOr(b?.swiss_average_rank, MAX_SORT))
    || compareNumber(nullableRank(a?.swiss_rank_region), nullableRank(b?.swiss_rank_region))
    || compareNumber(nullableRank(a?.swiss_rank_global), nullableRank(b?.swiss_rank_global))
    || compareStrengthRegionMembers(a, b);
}

function compareRegionMembers(a, b) {
  if (isAdvancementStrengthMode()) return compareStrengthRegionMembers(a, b);
  return compareSwissMetricMembers(a, b, advancementAnalysisKey);
}

function resolveProbabilityTone(entry, key = advancementAnalysisKey) {
  const value = advancementMetricValue(entry, key);
  const analysis = ADVANCEMENT_ANALYSIS_BY_KEY[key] || currentAdvancementAnalysis();
  if (analysis.tone === "risk") {
    if (value >= 0.6) return { cardClass: "metric-risk-high", badgeClass: "metric-risk-high", badgeLabel: "高风险" };
    if (value >= 0.35) return { cardClass: "metric-risk-mid", badgeClass: "metric-risk-mid", badgeLabel: "警戒" };
    if (value >= 0.15) return { cardClass: "metric-risk-low", badgeClass: "metric-risk-low", badgeLabel: "观察" };
    return { cardClass: "metric-risk-safe", badgeClass: "metric-risk-safe", badgeLabel: "安全" };
  }
  if (analysis.tone === "revival") {
    if (value >= 0.45) return { cardClass: "metric-revival-heavy", badgeClass: "metric-revival-heavy", badgeLabel: "复活态" };
    if (value >= 0.25) return { cardClass: "metric-revival-mid", badgeClass: "metric-revival-mid", badgeLabel: "泡泡位" };
    if (value >= 0.1) return { cardClass: "metric-revival-low", badgeClass: "metric-revival-low", badgeLabel: "过渡带" };
    return { cardClass: "metric-revival-thin", badgeClass: "metric-revival-thin", badgeLabel: "占比低" };
  }
  if (value >= 0.8) return { cardClass: "metric-positive-high", badgeClass: "metric-positive-high", badgeLabel: "高位" };
  if (value >= 0.55) return { cardClass: "metric-positive-mid", badgeClass: "metric-positive-mid", badgeLabel: "稳态" };
  if (value >= 0.3) return { cardClass: "metric-positive-low", badgeClass: "metric-positive-low", badgeLabel: "观察" };
  return { cardClass: "metric-positive-risk", badgeClass: "metric-positive-risk", badgeLabel: "风险" };
}

function advancementDisplayState(entry) {
  if (isAdvancementStrengthMode()) {
    return {
      cardClass: qualificationClass(originalQualificationStatus(entry)),
      primaryBadgeClass: qualificationClass(originalQualificationStatus(entry)),
      primaryBadgeLabel: originalQualificationLabel(entry),
      secondaryBadgeClass: "",
      secondaryBadgeLabel: "",
    };
  }
  const tone = resolveProbabilityTone(entry, advancementAnalysisKey);
  return {
    cardClass: tone.cardClass,
    primaryBadgeClass: tone.badgeClass,
    primaryBadgeLabel: tone.badgeLabel,
    secondaryBadgeClass: "metric-neutral",
    secondaryBadgeLabel: currentQualificationLabel(entry),
  };
}

function advancementPrimaryMetricLine(entry) {
  const analysis = currentAdvancementAnalysis();
  return {
    kicker: analysis.short,
    value: advancementMetricDisplay(advancementMetricValue(entry), analysis.key),
  };
}

function advancementMetaLines(entry) {
  const distanceText = entry?.dist_km != null ? `${esc(entry.dist_km)} km` : "—";
  if (isAdvancementStrengthMode()) {
    return {
      label: `复活及以上 ${percentOr(entry?.swiss_revival_probability)} · 国赛 ${percentOr(entry?.swiss_national_probability)}`,
      sub: distanceText,
    };
  }
  return {
    label: `实力分 ${fixedOr(entry?.strength_score)} · ${distanceText}`,
    sub: `复活及以上 ${percentOr(entry?.swiss_revival_probability)} · 国赛 ${percentOr(entry?.swiss_national_probability)}`,
  };
}

function compareStrengthTeams(a, b, key, direction) {
  let cmp = 0;
  if (key === "school") {
    cmp = compareText(a.school, b.school);
  } else if (key === "assigned") {
    cmp = compareNumber(numOr(REGION_ORDER[a.assigned], 9), numOr(REGION_ORDER[b.assigned], 9));
  } else if (key === "strength_score") {
    cmp = compareNumber(numOr(a.strength_score, 0), numOr(b.strength_score, 0));
  } else if (key === "rmul_bonus") {
    cmp = compareNumber(componentScore(a, "rmul_bonus"), componentScore(b, "rmul_bonus"));
  } else if (key === "full_form_score") {
    cmp = compareNumber(componentScore(a, "full_form_score"), componentScore(b, "full_form_score"));
  } else if (key === "history_bonus") {
    cmp = compareNumber(componentScore(a, "history_bonus"), componentScore(b, "history_bonus"));
  } else if (key === "points_score") {
    cmp = compareNumber(componentScore(a, "points_score"), componentScore(b, "points_score"));
  } else if (key === "qualification_status") {
    cmp = compareNumber(
      numOr(QUALIFICATION_ORDER[currentQualificationStatus(a)], 9),
      numOr(QUALIFICATION_ORDER[currentQualificationStatus(b)], 9)
    );
  } else if (key === "is_submitted") {
    cmp = compareNumber(inferSubmitted(a) ? 1 : 0, inferSubmitted(b) ? 1 : 0);
  } else {
    cmp = compareNumber(nullableRank(a.strength_rank_global), nullableRank(b.strength_rank_global));
  }

  if (cmp !== 0) return direction === "desc" ? -cmp : cmp;
  return compareStrengthRegionMembers(a, b);
}

function setStrengthSort(key) {
  const defaultDirection = STRENGTH_SORT_DEFAULTS[key] || "asc";
  if (strengthSortState.key === key) {
    strengthSortState.direction = strengthSortState.direction === "asc" ? "desc" : "asc";
  } else {
    strengthSortState = { key, direction: defaultDirection };
  }
  if (currentData) renderStrength(currentData);
}

function sortIndicator(key) {
  if (strengthSortState.key !== key) return "↕";
  return strengthSortState.direction === "asc" ? "↑" : "↓";
}

function sortableHeader(label, key) {
  const active = strengthSortState.key === key ? "active" : "";
  return `<th class="sortable ${active}" data-sort="${key}">${esc(label)}<span class="sort-indicator">${sortIndicator(key)}</span></th>`;
}

function normalizeRegion(region = {}) {
  const primaryMembers = Array.isArray(region.members) ? region.members : [];
  const hiddenMembers = Array.isArray(region.hidden_members) ? region.hidden_members : [];
  const dedupedMembers = [];
  const seenSchools = new Set();
  [...primaryMembers, ...hiddenMembers].forEach((member) => {
    if (!member?.school || seenSchools.has(member.school)) return;
    seenSchools.add(member.school);
    dedupedMembers.push(member);
  });
  const combinedMembers = dedupedMembers.sort(compareRegionMembers);
  const submittedCount = combinedMembers.filter((member) => inferSubmitted(member)).length;
  const estimatedCount = combinedMembers.length - submittedCount;
  const counts = region?.counts ? {
    host: numOr(region.counts.host),
    volunteer: numOr(region.counts.volunteer),
    transfer: numOr(region.counts.transfer),
  } : combinedMembers.reduce((acc, member) => {
    const key = member?.status;
    if (key && Object.prototype.hasOwnProperty.call(acc, key)) acc[key] += 1;
    return acc;
  }, { host: 0, volunteer: 0, transfer: 0 });
  return {
    ...region,
    count: numOr(region.count, combinedMembers.length),
    visible_count: numOr(region.visible_count, combinedMembers.length),
    hidden_count: numOr(region.hidden_count, estimatedCount),
    submitted_count: numOr(region.submitted_count, submittedCount),
    estimated_count: numOr(region.estimated_count, estimatedCount),
    members: combinedMembers,
    hidden_members: hiddenMembers,
    counts,
  };
}

function normalizeSummary(summary = {}, region = {}) {
  return {
    ...summary,
    national_spots: numOr(summary.national_spots, numOr(region.national_spots)),
    revival_spots: numOr(summary.revival_spots, numOr(region.revival_spots)),
    top16_count: numOr(summary.top16_count, numOr(region.top16_count)),
    floating_spots: numOr(summary.floating_spots, numOr(region.floating_spots)),
    advancing_total: numOr(
      summary.advancing_total,
      numOr(
        region.advancing_total,
        numOr(summary.national_spots, numOr(region.national_spots))
          + numOr(summary.revival_spots, numOr(region.revival_spots))
      )
    ),
  };
}

function normalizeStrengthStats(stats = {}) {

    avg_strength_score: numOr(stats.avg_strength_score),
    median_strength_score: numOr(stats.median_strength_score),

    min_strength_score: numOr(stats.min_strength_score),
    max_strength_score: numOr(stats.max_strength_score),
    q1_strength_score: numOr(stats.q1_strength_score),
    q3_strength_score: numOr(stats.q3_strength_score),
    iqr_strength_score: numOr(stats.iqr_strength_score),
  };
}

function metricPercent(value, minValue, maxValue, higherBetter = true) {
  if (maxValue <= minValue) return 100;
  const raw = higherBetter
    ? (value - minValue) / (maxValue - minValue)
    : (maxValue - value) / (maxValue - minValue);
  return Math.max(12, Math.min(100, 12 + raw * 88));
}

function normalizeSharkDecision(decision) {
  if (!decision) return null;
  const schools = Object.fromEntries(
    Object.entries(decision.schools || {}).map(([school, entry]) => [
      school,
      {
        target: entry.target || {},
        same_city_rival: entry.same_city_rival || null,
        observed_state: entry.observed_state || {},
        options: [...(entry.options || [])]
          .map((option) => normalizeDecisionResult(option))
          .sort((a, b) => compareNumber(
            numOr(REGION_ORDER[a.volunteer], 9),
            numOr(REGION_ORDER[b.volunteer], 9),
          )),
        recommendation: normalizeDecisionResult(entry.recommendation || {}),
      },
    ])
  );
  return {
    updated_at_utc: decision.updated_at_utc || "",
    updated_at_cst: decision.updated_at_cst || "",
    default_school: decision.default_school || Object.keys(schools)[0] || "",
    school_count: numOr(decision.school_count, Object.keys(schools).length),
    model_note: decision.model_note || "",
    model_weights: decision.model_weights || {},
    schools,
  };
}

function normalizeSwissSimulation(simulation) {
  if (!simulation) return null;
  const schools = [...(simulation.schools || [])]
    .map((entry) => normalizeSwissSchool(entry))
    .sort((a, b) => (
      compareNumber(numOr(REGION_ORDER[a.assigned], 9), numOr(REGION_ORDER[b.assigned], 9))
      || compareNumber(numOr(a.average_rank), numOr(b.average_rank))
      || compareNumber(nullableRank(a.seed_rank_region), nullableRank(b.seed_rank_region))
      || compareText(a.school, b.school)
    ));
  const regions = [...(simulation.regions || [])]
    .sort((a, b) => compareNumber(numOr(REGION_ORDER[a.region], 9), numOr(REGION_ORDER[b.region], 9)));
  const sampleRegions = [...(simulation.sample_regions || [])]
    .map((entry) => normalizeGlobalSwissSampleRegion(entry))
    .sort((a, b) => compareNumber(numOr(REGION_ORDER[a.region], 9), numOr(REGION_ORDER[b.region], 9)));
  const defaultSchool = simulation.default_school || schools[0]?.school || "";
  const defaultRegion = simulation.default_region
    || schools.find((entry) => entry.school === defaultSchool)?.assigned
    || sampleRegions[0]?.region
    || "";
  return {
    default_school: defaultSchool,
    default_region: defaultRegion,
    model_note: simulation.model_note || "",
    meta: simulation.meta || {},
    samples_path: simulation.samples_path || "global_swiss_samples.json",
    schools,
    regions,
    sample_regions: sampleRegions,
  };
}

function invalidateLazyCaches() {
  globalSwissSamplesCache = null;
  globalSwissSamplesPromise = null;
  volunteerDecisionCache = null;
  volunteerDecisionPromise = null;
}

async function loadJsonAsset(path) {
  const res = await fetch(`./${path}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function ensureGlobalSwissSamplesLoaded(data) {
  if (globalSwissSamplesCache) return globalSwissSamplesCache;
  if (!globalSwissSamplesPromise) {
    const path = data?.swiss_simulation?.samples_path || "global_swiss_samples.json";
    globalSwissSamplesPromise = loadJsonAsset(path)
      .then((payload) => {
        globalSwissSamplesCache = payload;
        return payload;
      })
      .finally(() => {
        globalSwissSamplesPromise = null;
      });
  }
  return await globalSwissSamplesPromise;
}

async function ensureVolunteerDecisionLoaded(data) {
  if (volunteerDecisionCache) return volunteerDecisionCache;
  if (!volunteerDecisionPromise) {
    const path = data?.shark_decision?.lazy_path || "volunteer_decision.json";
    volunteerDecisionPromise = loadJsonAsset(path)
      .then((payload) => {
        volunteerDecisionCache = normalizeSharkDecision(payload);
        return volunteerDecisionCache;
      })
      .finally(() => {
        volunteerDecisionPromise = null;
      });
  }
  return await volunteerDecisionPromise;
}

function renderRegionStrength(data) {
  const panel = data.advancement_panel || {};
  const regions = [...(data.regions || [])]
    .map((region) => normalizeRegion(region))
    .sort((a, b) => REGION_ORDER[a.key] - REGION_ORDER[b.key]);
  const regionByKey = Object.fromEntries(regions.map((region) => [region.key, region]));
  const summaries = [...(panel.region_summaries || [])]
    .map((summary) => {
      const region = regionByKey[summary.key] || {};
      return {
        ...summary,
        region,
        strength_stats: normalizeStrengthStats(summary.strength_stats || region.strength_stats),
      };
    })
    .sort((a, b) => (
      numOr(b.strength_stats.avg_strength_score) - numOr(a.strength_stats.avg_strength_score)
      || REGION_ORDER[a.key] - REGION_ORDER[b.key]
    ));

  const avgValues = summaries.map((summary) => summary.strength_stats.avg_strength_score);
  const medianValues = summaries.map((summary) => summary.strength_stats.median_strength_score);
  const top8Values = summaries.map((summary) => summary.strength_stats.top8_avg_strength_score);
  const stdevValues = summaries.map((summary) => summary.strength_stats.stdev_strength_score);
  const avgMin = Math.min(...avgValues, 0);
  const avgMax = Math.max(...avgValues, 0);
  const medianMin = Math.min(...medianValues, 0);
  const medianMax = Math.max(...medianValues, 0);
  const top8Min = Math.min(...top8Values, 0);
  const top8Max = Math.max(...top8Values, 0);
  const stdevMin = Math.min(...stdevValues, 0);
  const stdevMax = Math.max(...stdevValues, 0);
  const strongestAvg = summaries[0];
  const strongestTop8 = [...summaries].sort((a, b) => (
    numOr(b.strength_stats.top8_avg_strength_score) - numOr(a.strength_stats.top8_avg_strength_score)
    || REGION_ORDER[a.key] - REGION_ORDER[b.key]
  ))[0];
  const mostStable = [...summaries].sort((a, b) => (
    numOr(a.strength_stats.stdev_strength_score) - numOr(b.strength_stats.stdev_strength_score)
    || REGION_ORDER[a.key] - REGION_ORDER[b.key]
  ))[0];

  const cards = summaries.map((summary, idx) => {
    const stats = summary.strength_stats;

function globalSwissStatusLabel(status) {
  if (status === "advance") return "晋级";
  if (status === "eliminated") return "淘汰";
  return "继续";
}

function globalSwissRecordText(record) {
  return `${record?.wins ?? 0}-${record?.losses ?? 0}`;
}

function globalSwissScheduleNo(match) {
  const id = String(match?.match_id || "");
  const swiss = id.match(/^([AB])-R(\d+)-(\d+)$/);
  if (swiss) {
    const group = swiss[1];
    const round = Number(swiss[2]);
    const order = Number(swiss[3]);
    const offsets = {
      A: { 1: 0, 2: 16, 3: 32, 4: 48, 5: 60 },
      B: { 1: 8, 2: 24, 3: 40, 4: 54, 5: 63 },
    };
    const offset = offsets[group]?.[round];
    if (offset != null) return String(offset + order).padStart(2, "0");
  }
  const knockout = id.match(/^(R16|QF|P1|SF|P2|TP|F)-(\d+)?$/);
  if (!knockout) return id || "—";
  const stage = knockout[1];
  const order = Number(knockout[2] || "1");
  if (stage === "R16") return String(66 + order);
  if (stage === "QF") return String(74 + order);
  if (stage === "P1") return String(78 + order);
  if (stage === "SF") return String(82 + order);
  if (stage === "P2") return String(84 + order);
  if (stage === "TP") return "87";
  if (stage === "F") return "88";
  return id || "—";
}

function globalSwissNodeId(...parts) {
  const raw = parts.map((part) => String(part ?? "")).join("|");
  let hash = 2166136261;
  for (const ch of raw) {
    hash ^= ch.codePointAt(0);
    hash = Math.imul(hash, 16777619);
  }
  return `gs-${(hash >>> 0).toString(16)}`;
}

function globalSwissClampZoom(value) {
  return Math.max(0.55, Math.min(1.85, value));
}

function globalSwissSwissBucketLabel(match, roundNumber) {
  if (roundNumber === 1) return "0-0";
  return globalSwissRecordText(match?.pre_record?.left);
}

function renderGlobalSwissMatchCard(match, nodeId) {
  if (!match) return "";
  const leftWon = match.winner_school === match.left?.school;
  const rightWon = match.winner_school === match.right?.school;
  const stageClass = /championship|third_place/.test(match.stage || "")
    ? "accent-gold"
    : /quarterfinal|semifinal|round_of_16/.test(match.stage || "")
      ? "accent-blue"
      : /placement_round/.test(match.stage || "")
        ? "accent-slate"
        : "accent-cyan";
  return `
    <article class="gs-match-card ${stageClass}" id="${esc(nodeId)}" data-gs-node="${esc(nodeId)}">
      <div class="gs-match-badge">${esc(globalSwissScheduleNo(match))}</div>
      <div class="gs-match-body">
        <div class="gs-team-row ${leftWon ? "winner" : ""}">
          <div class="name">${esc(match.left?.school || "—")}</div>
          <div class="score">${match.score?.left ?? "—"}</div>
        </div>
        <div class="gs-team-row ${rightWon ? "winner" : ""}">
          <div class="name">${esc(match.right?.school || "—")}</div>
          <div class="score">${match.score?.right ?? "—"}</div>
        </div>
      </div>
    </article>
  `;
}

function buildGlobalSwissSwissColumns(groupKey, sample, finalRankingBySchool) {
  const rounds = groupKey === "A"
    ? (sample.swiss?.group_a_rounds || [])
    : (sample.swiss?.group_b_rounds || []);
  const finalRows = sample.group_final?.[groupKey] || [];
  const withBadge = (entry) => ({ ...entry, ...(finalRankingBySchool[entry.school] || {}) });
  const advanceRows = finalRows.filter((entry) => entry.record?.wins === 3).map(withBadge);
  const eliminatedRows = finalRows.filter((entry) => entry.record?.losses === 3).map(withBadge);
  const layout = [
    { round: 1, record: "0-0", title: "R1", subtitle: "0-0 开局轮" },
    { round: 2, record: "1-0", title: "R2", subtitle: "1-0" },
    { round: 2, record: "0-1", title: "R2", subtitle: "0-1" },
    { round: 3, record: "2-0", title: "R3", subtitle: "2-0" },
    { round: 3, record: "1-1", title: "R3", subtitle: "1-1" },
    { round: 3, record: "0-2", title: "R3", subtitle: "0-2" },
    { round: 4, record: "2-1", title: "R4", subtitle: "2-1" },
    { round: 4, record: "1-2", title: "R4", subtitle: "1-2" },
    { round: 5, record: "2-2", title: "R5", subtitle: "2-2 决胜轮" },
  ];
  const columns = layout.map((item) => ({
    ...item,
    type: "matches",
    matches: (rounds[item.round - 1]?.matches || []).filter((match) => globalSwissSwissBucketLabel(match, item.round) === item.record),
  }));
  columns.push({
    type: "terminal",
    title: "晋级16强",
    subtitle: "3 胜即出线",
    mode: "advance",
    entries: advanceRows,
  });
  columns.push({
    type: "terminal",
    title: "小组淘汰",
    subtitle: "3 负即出局",
    mode: "eliminated",
    entries: eliminatedRows,
  });
  return columns;
}

function appendGlobalSwissAppearance(paths, school, appearance) {
  if (!school) return;
  if (!paths[school]) paths[school] = [];
  paths[school].push(appearance);
}

function buildGlobalSwissSchoolPathConnectors(paths) {
  const connectors = [];
  Object.values(paths).forEach((appearances) => {
    appearances.sort((left, right) => (
      left.step - right.step
      || left.order - right.order
      || compareText(left.nodeId, right.nodeId)
    ));
    for (let index = 0; index < appearances.length - 1; index += 1) {
      const current = appearances[index];
      const next = appearances[index + 1];
      if (current.nodeId === next.nodeId) continue;
      connectors.push({
        from: current.nodeId,
        to: next.nodeId,
        kind: current.kind || "advance",
      });
    }
  });
  return connectors;
}

function buildGlobalSwissSwissConnectors(groupKey, sample) {
  const rounds = groupKey === "A"
    ? (sample.swiss?.group_a_rounds || [])
    : (sample.swiss?.group_b_rounds || []);
  const finals = sample.group_final?.[groupKey] || [];
  const paths = {};

  rounds.forEach((round, roundIndex) => {
    (round.matches || []).forEach((match, matchIndex) => {
      const nodeId = globalSwissNodeId("swiss", groupKey, round.round || (roundIndex + 1), match.match_id || matchIndex);
      appendGlobalSwissAppearance(paths, match.left?.school, {
        nodeId,
        step: (round.round || (roundIndex + 1)) * 10,
        order: matchIndex,
        kind: match.winner_school === match.left?.school ? "win" : "lose",
      });
      appendGlobalSwissAppearance(paths, match.right?.school, {
        nodeId,
        step: (round.round || (roundIndex + 1)) * 10,
        order: matchIndex,
        kind: match.winner_school === match.right?.school ? "win" : "lose",
      });
    });
  });

  finals.forEach((entry, entryIndex) => {
    const mode = entry.record?.wins === 3 ? "advance" : "eliminated";
    appendGlobalSwissAppearance(paths, entry.school, {
      nodeId: globalSwissNodeId("swiss-terminal", groupKey, mode, entry.school),
      step: 100,
      order: entryIndex,
      kind: mode,
    });
  });
  return buildGlobalSwissSchoolPathConnectors(paths);
}

function buildGlobalSwissKnockoutConnectors(sample) {
  const stageOrder = [
    ["round_of_16", sample.knockout?.round_of_16 || [], 10],
    ["quarterfinal", sample.knockout?.quarterfinal || [], 20],
    ["semifinal", sample.knockout?.semifinal || [], 30],
    ["third_place", sample.knockout?.third_place ? [sample.knockout.third_place] : [], 40],
    ["championship", sample.knockout?.championship ? [sample.knockout.championship] : [], 50],
  ];
  const paths = {};
  stageOrder.forEach(([stageKey, matches, step]) => {
    matches.forEach((match, matchIndex) => {
      const nodeId = globalSwissNodeId("ko", stageKey, match.match_id || matchIndex);
      appendGlobalSwissAppearance(paths, match.left?.school, {
        nodeId,
        step,
        order: matchIndex,
        kind: match.winner_school === match.left?.school ? "win" : "lose",
      });
      appendGlobalSwissAppearance(paths, match.right?.school, {
        nodeId,
        step,
        order: matchIndex,
        kind: match.winner_school === match.right?.school ? "win" : "lose",
      });
    });
  });
  return buildGlobalSwissSchoolPathConnectors(paths);
}

function buildGlobalSwissQualificationConnectors(sample) {
  const columns = sample.knockout?.qualification?.columns || [];
  const paths = {};
  columns.forEach((column, columnIndex) => {
    const step = 20 + columnIndex * 5;
    (column.matches || []).forEach((match, matchIndex) => {
      const nodeId = globalSwissNodeId("qual", column.record, match.match_id || matchIndex);
      appendGlobalSwissAppearance(paths, match.left?.school, {
        nodeId,
        step,
        order: matchIndex,
        kind: match.winner_school === match.left?.school ? "win" : "lose",
      });
      appendGlobalSwissAppearance(paths, match.right?.school, {
        nodeId,
        step,
        order: matchIndex,
        kind: match.winner_school === match.right?.school ? "win" : "lose",
      });
    });
    (column.standings || []).forEach((entry, entryIndex) => {
      appendGlobalSwissAppearance(paths, entry.school, {
        nodeId: globalSwissNodeId("qual-terminal", column.record, entry.school),
        step: step + 1,
        order: entryIndex,
        kind: entry.qualification_result === "out" ? "eliminated" : "advance",
      });

  });
  return buildGlobalSwissSchoolPathConnectors(paths);
}

function drawGlobalSwissConnectors(panel) {
  const canvas = panel.querySelector("#globalSwissFlowCanvas");
  const svg = panel.querySelector("#globalSwissFlowLines");
  if (!canvas || !svg) return;
  const connectors = panel._globalSwissConnectors || [];
  const width = Math.ceil(canvas.offsetWidth);
  const height = Math.ceil(canvas.offsetHeight);
  const canvasRect = canvas.getBoundingClientRect();
  const zoom = Number(canvas.dataset.zoom || globalSwissZoom || 1) || 1;
  const shapes = [
    `<defs>
      <marker id="gs-arrow-win" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 z" fill="rgba(214, 145, 28, 0.96)"></path>
      </marker>
      <marker id="gs-arrow-lose" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 z" fill="rgba(56, 108, 168, 0.9)"></path>
      </marker>
    </defs>`,
  ];

  connectors.forEach((connector) => {
    const fromEl = document.getElementById(connector.from);
    const toEl = document.getElementById(connector.to);
    if (!fromEl || !toEl || !canvas.contains(fromEl) || !canvas.contains(toEl)) return;
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    const startX = (fromRect.right - canvasRect.left) / zoom;
    const startY = (
      fromRect.top
      - canvasRect.top
      + fromRect.height / 2
      + (connector.kind === "lose" || connector.kind === "eliminated" ? 6 : -6)
    ) / zoom;
    const endX = (toRect.left - canvasRect.left) / zoom;
    const endY = (
      toRect.top
      - canvasRect.top
      + toRect.height / 2
      + (connector.kind === "lose" || connector.kind === "eliminated" ? -4 : 4)
    ) / zoom;
    const midX = startX + Math.max(28, (endX - startX) / 2);
    const markerId = connector.kind === "lose" || connector.kind === "eliminated" ? "gs-arrow-lose" : "gs-arrow-win";
    shapes.push(
      `<path class="gs-flow-line ${esc(connector.kind)}" d="M ${startX} ${startY} H ${midX} V ${endY} H ${endX}" marker-end="url(#${markerId})"></path>`
    );
  });

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = shapes.join("");
}

function setGlobalSwissZoom(panel, nextZoom, options = {}) {
  const viewport = panel.querySelector("#globalSwissFlowViewport");
  const scroller = panel.querySelector("#globalSwissFlowScroller");
  const canvas = panel.querySelector("#globalSwissFlowCanvas");
  const range = panel.querySelector("#globalSwissZoomRange");
  const readout = panel.querySelector("#globalSwissZoomReadout");
  if (!viewport || !scroller || !canvas) return;

  const previousZoom = Number(canvas.dataset.zoom || globalSwissZoom || 1);
  const unscaledWidth = Math.ceil(canvas.offsetWidth);
  const unscaledHeight = Math.ceil(canvas.offsetHeight);
  const centerX = options.preserveCenter === false ? 0 : (viewport.scrollLeft + viewport.clientWidth / 2) / previousZoom;
  const centerY = options.preserveCenter === false ? 0 : (viewport.scrollTop + viewport.clientHeight / 2) / previousZoom;

  globalSwissZoom = globalSwissClampZoom(nextZoom);
  canvas.dataset.zoom = String(globalSwissZoom);
  canvas.style.transform = `scale(${globalSwissZoom})`;
  scroller.style.width = `${Math.max(viewport.clientWidth, Math.ceil(unscaledWidth * globalSwissZoom + 24))}px`;
  scroller.style.height = `${Math.max(viewport.clientHeight, Math.ceil(unscaledHeight * globalSwissZoom + 24))}px`;

  if (options.mode === "fit") {
    viewport.scrollLeft = 0;
    viewport.scrollTop = 0;
  } else if (options.preserveCenter !== false) {
    viewport.scrollLeft = Math.max(0, centerX * globalSwissZoom - viewport.clientWidth / 2);
    viewport.scrollTop = Math.max(0, centerY * globalSwissZoom - viewport.clientHeight / 2);
  }

  if (range) range.value = String(Math.round(globalSwissZoom * 100));
  if (readout) readout.textContent = `${Math.round(globalSwissZoom * 100)}%`;
  drawGlobalSwissConnectors(panel);
}

function fitGlobalSwissDiagram(panel) {
  const viewport = panel.querySelector("#globalSwissFlowViewport");
  const canvas = panel.querySelector("#globalSwissFlowCanvas");
  if (!viewport || !canvas) return;
  const targetZoom = globalSwissClampZoom((viewport.clientWidth - 24) / Math.max(canvas.offsetWidth, 1));
  setGlobalSwissZoom(panel, targetZoom, { preserveCenter: false, mode: "fit" });
}

function initGlobalSwissFlow(panel) {
  const viewport = panel.querySelector("#globalSwissFlowViewport");
  const zoomOut = panel.querySelector("#globalSwissZoomOut");
  const zoomIn = panel.querySelector("#globalSwissZoomIn");
  const zoomReset = panel.querySelector("#globalSwissZoomReset");
  const zoomFit = panel.querySelector("#globalSwissZoomFit");
  const zoomRange = panel.querySelector("#globalSwissZoomRange");
  if (!viewport) return;

  let drag = null;
  viewport.addEventListener("pointerdown", (event) => {
    if (event.target.closest("button,select,input,label,a")) return;
    drag = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      left: viewport.scrollLeft,
      top: viewport.scrollTop,
    };
    viewport.classList.add("dragging");
    viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener("pointermove", (event) => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    viewport.scrollLeft = drag.left - (event.clientX - drag.x);
    viewport.scrollTop = drag.top - (event.clientY - drag.y);
  });
  const stopDrag = (event) => {
    if (drag && drag.pointerId === event.pointerId) {
      drag = null;
      viewport.classList.remove("dragging");
    }
  };
  viewport.addEventListener("pointerup", stopDrag);
  viewport.addEventListener("pointercancel", stopDrag);
  viewport.addEventListener("wheel", (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    event.preventDefault();
    setGlobalSwissZoom(panel, globalSwissZoom + (event.deltaY > 0 ? -0.08 : 0.08));
  }, { passive: false });

  if (zoomOut) zoomOut.addEventListener("click", () => setGlobalSwissZoom(panel, globalSwissZoom - 0.1));
  if (zoomIn) zoomIn.addEventListener("click", () => setGlobalSwissZoom(panel, globalSwissZoom + 0.1));
  if (zoomReset) zoomReset.addEventListener("click", () => setGlobalSwissZoom(panel, 1, { preserveCenter: false }));
  if (zoomFit) zoomFit.addEventListener("click", () => fitGlobalSwissDiagram(panel));
  if (zoomRange) {
    zoomRange.addEventListener("input", (event) => {
      setGlobalSwissZoom(panel, Number(event.target.value) / 100, { preserveCenter: false });
    });
  }

  requestAnimationFrame(() => {
    if (!globalSwissZoom) {
      fitGlobalSwissDiagram(panel);
    } else {
      setGlobalSwissZoom(panel, globalSwissZoom, { preserveCenter: false });
    }
    requestAnimationFrame(() => drawGlobalSwissConnectors(panel));
    setTimeout(() => drawGlobalSwissConnectors(panel), 120);
  });
}

        <p>该样本下的最终 1-32 名次。资格结果仅按当前赛区的 2026 国赛 / 复活赛配额切线。</p>
        <div class="gs-ranking-list">
          ${(sample.final_ranking || []).map((entry) => `
            <div class="gs-ranking-row qual-${entry.qualification_result || "out"}">
              <div class="rank">${entry.rank ?? "—"}</div>
              <div>
                <div class="school-row">
                  <div class="school">${esc(entry.school || "—")}</div>
                </div>
                <div class="meta">${esc(entry.team || "—")} · ${esc(entry.slot || "—")} · 种子 #${entry.seed_rank_region ?? "—"} · ${globalSwissRecordText(entry.record)}${entry.qualification_decided_title ? ` · 资格确定：${esc(entry.qualification_decided_title)}` : ""}</div>
              </div>
              <div class="qual">${esc(entry.qualification_label || "—")}</div>
              <div class="avg">SOS ${entry.sos ?? "—"}</div>
            </div>
          `).join("")}
        </div>
      </section>
    </section>
  `;

  initGlobalSwissFlow(panel);

  const select = panel.querySelector("#globalSwissRegionSelect");
  if (select) {
    select.addEventListener("change", (event) => {
      globalSwissSelectedRegion = event.target.value;
      globalSwissSampleIndexByRegion[globalSwissSelectedRegion] = 0;
      if (currentData) renderGlobalSwissStage(currentData);
    });
  }
  const randomBtn = panel.querySelector("#globalSwissRandomBtn");
  if (randomBtn) {
    randomBtn.addEventListener("click", () => {
      const total = regionEntry.samples.length;
      if (!total) return;
      let nextIndex = selectedIndex;
      if (total > 1) {
        while (nextIndex === selectedIndex) {
          nextIndex = Math.floor(Math.random() * total);
        }
      }
      globalSwissSampleIndexByRegion[regionEntry.region] = nextIndex;
      if (currentData) renderGlobalSwissStage(currentData);
    });
  }
}

function renderSwissSimulation(data) {
  const panel = document.getElementById("panel-swiss-simulation");
  const simulation = normalizeSwissSimulation(data.swiss_simulation);
  if (!simulation || !simulation.schools.length) {
    panel.innerHTML = `<div class="empty">当前还没有生成瑞士轮模拟数据，请先构建并发布最新 data.json。</div>`;
    return;
  }

  const schoolByName = Object.fromEntries(simulation.schools.map((entry) => [entry.school, entry]));
  if (!swissSelectedSchool || !schoolByName[swissSelectedSchool]) {
    swissSelectedSchool = simulation.default_school || simulation.schools[0].school;
  }
  const selected = schoolByName[swissSelectedSchool];
  const region = simulation.regions.find((entry) => entry.region === selected.assigned) || {};
  const meta = simulation.meta || {};
  const bubble = region.bubble || {};

  const schoolOptions = simulation.regions.map((entry) => {
    const members = simulation.schools.filter((school) => school.assigned === entry.region);
    return `
      <optgroup label="${esc(entry.region)}赛区">
        ${members.map((school) => `
          <option value="${esc(school.school)}" ${school.school === selected.school ? "selected" : ""}>
            ${esc(school.school)} · ${esc(school.team)} · ${esc(school.seed_tier)}
          </option>
        `).join("")}
      </optgroup>
    `;
  }).join("");

  const stageRows = SWISS_STAGE_ORDER.map((stage) => {
    const value = numOr(selected.stage_probabilities?.[stage]);
    return `
      <div class="sim-stage-row">
        <span class="label">${esc(SWISS_STAGE_LABELS[stage])}</span>
        <div class="sim-track"><div class="sim-fill" style="width:${fixedOr(value * 100, 1, "0.0")}%"></div></div>
        <span class="metric">${percentOr(value)}</span>
      </div>
    `;
  }).join("");

  const bubbleRows = [
    ["国赛线", bubble.last_national, "national_probability"],
    ["复活起点", bubble.first_revival, "revival_probability"],
    ["复活线", bubble.last_revival, "revival_probability"],
    ["落选线", bubble.first_out, "out_probability"],
  ].map(([label, entry, key]) => {
    if (!entry) {
      return `
        <div class="sim-bubble-row">
          <span class="tag">${esc(label)}</span>
          <span class="school">—</span>
          <span class="meta">当前没有对应边界学校</span>
          <span class="metric">—</span>
        </div>
      `;
    }
    const value = numOr(entry[key]);
    return `
      <div class="sim-bubble-row">
        <span class="tag">${esc(label)}</span>
        <div>
          <div class="school">${esc(entry.school)}</div>
          <div class="meta">种子 #${entry.seed_rank_region ?? "—"} · ${esc(entry.seed_tier || "—")} · 平均名次 ${fixedOr(entry.average_rank, 2, "—")}</div>
        </div>
        <span class="metric">${key === "out_probability" ? "出局" : key === "national_probability" ? "国赛" : "复活及以上"} ${percentOr(value)}</span>
        <span class="metric">差值 ${signedPercentOr(numOr(selected[key]) - value)}</span>
      </div>
    `;
  }).join("");

  panel.innerHTML = `
    <section class="sim-stage">
      <section class="sim-overview">
        <div class="sim-head">
          <div>
            <h2>瑞士轮模拟</h2>
            <p>${esc(simulation.model_note || "基于最新调剂快照与 2025 场序规则，对每个赛区独立多次模拟并汇总 2026 口径的国赛/复活赛概率。")}</p>
          </div>
          <div class="pill-row">
            <span class="pill"><strong>迭代</strong>${numOr(meta.iterations)}</span>
            <span class="pill"><strong>口径</strong>${esc(meta.quota_mode || "2026")}</span>
            <span class="pill"><strong>默认学校</strong>${esc(simulation.default_school || "—")}</span>
          </div>
        </div>
        <div class="sim-control-row">
          <div class="sim-select-wrap">
            <label for="swissSchoolSelect">学校分析</label>
            <select id="swissSchoolSelect" class="sim-select">${schoolOptions}</select>
          </div>
          <div class="pill-row">
            <span class="pill"><strong>赛区</strong>${esc(selected.assigned)}</span>
            <span class="pill"><strong>种子</strong>#${selected.seed_rank_region ?? "—"} · ${esc(selected.seed_tier)}</span>
            <span class="pill"><strong>最可能</strong>${esc(selected.most_likely_stage_label)} ${percentOr(selected.most_likely_stage_probability)}</span>
          </div>
        </div>
      </section>

      <div class="sim-detail-grid">
        <article class="sim-detail-card">
          <h3>${esc(selected.school)}</h3>
          <p>${esc(selected.team)} · ${esc(selected.city)} · ${esc(selected.team_type)} · RMUL ${esc(selected.rmul_2026_top4_cn || "—")} · 2025 ${esc(selected.detail_2025_cn || "—")}</p>
          <div class="sim-profile-grid" style="margin-top:12px;">
            <div class="sim-stat">
              <span class="k">综合分</span>
              <span class="v">${fixedOr(selected.strength_score)}</span>
              <span class="hint">全局 #${selected.strength_rank_global ?? "—"} · 赛区 #${selected.strength_rank_region ?? "—"}</span>
            </div>
            <div class="sim-stat">
              <span class="k">积分 / 排名</span>
              <span class="v">${selected.points != null ? fixedOr(selected.points, 3) : "—"}</span>
              <span class="hint">积分榜 #${selected.rank ?? "—"}</span>
            </div>
            <div class="sim-stat">
              <span class="k">完整形态</span>
              <span class="v">#${selected.full_form_ranking ?? "—"}</span>
              <span class="hint">当前 boost 只取完整形态分组件与 RMUL 档位</span>
            </div>
            <div class="sim-stat">
              <span class="k">平均名次</span>
              <span class="v">${fixedOr(selected.average_rank, 2)}</span>
              <span class="hint">基于 ${numOr(meta.iterations)} 次模拟</span>
            </div>
          </div>
          <div class="sim-stage-list">${stageRows}</div>
        </article>

        <article class="sim-detail-card">
          <h3>概率卡片</h3>
          <p>“复活及以上”包含国赛概率；“仅复活”表示压线留在复活赛区间。</p>
          <div class="sim-prob-grid" style="margin-top:12px;">
            <div class="sim-stat">
              <span class="k">国赛概率</span>
              <span class="v">${percentOr(selected.national_probability)}</span>
              <span class="hint">最终名次落在赛区前 ${region.national_spots ?? "—"}</span>
            </div>
            <div class="sim-stat">
              <span class="k">复活及以上</span>
              <span class="v">${percentOr(selected.revival_probability)}</span>
              <span class="hint">当前总晋级线前 ${numOr(region.national_spots) + numOr(region.revival_spots)}</span>
            </div>
            <div class="sim-stat">
              <span class="k">仅复活赛</span>
              <span class="v">${percentOr(selected.revival_only_probability)}</span>
              <span class="hint">未进国赛但卡进复活赛区间</span>
            </div>
            <div class="sim-stat">
              <span class="k">出局概率</span>
              <span class="v">${percentOr(selected.out_probability)}</span>
              <span class="hint">最终落在本赛区复活线外</span>
            </div>
            <div class="sim-stat">
              <span class="k">Top 8</span>
              <span class="v">${percentOr(selected.top8_probability)}</span>
              <span class="hint">进入 8 强后的总体概率</span>
            </div>
            <div class="sim-stat">
              <span class="k">Top 4</span>
              <span class="v">${percentOr(selected.top4_probability)}</span>
              <span class="hint">进入半决赛的总体概率</span>
            </div>
            <div class="sim-stat">
              <span class="k">名额口径</span>
              <span class="v">${numOr(region.national_spots)} + ${numOr(region.revival_spots)}</span>
              <span class="hint">${esc(selected.assigned)}赛区当前国赛 / 复活名额</span>
            </div>
            <div class="sim-stat">
              <span class="k">随机基准</span>
              <span class="v">${esc(String(meta.seed_basis_hash || "—").slice(0, 8))}</span>
              <span class="hint">同一快照下结果可复现</span>
            </div>
          </div>
        </article>
      </div>

      <article class="sim-bubble-card">
        <h3>${esc(selected.assigned)}赛区泡泡位</h3>
        <p>边界学校按当前模拟概率排序得到，用来对比这支学校与国赛线、复活线的相对位置。</p>
        <div class="sim-bubble-list">${bubbleRows}</div>
      </article>
    </section>
  `;

  const select = panel.querySelector("#swissSchoolSelect");
  if (select) {
    select.addEventListener("change", (event) => {
      swissSelectedSchool = event.target.value;
      if (currentData) renderSwissSimulation(currentData);
    });
  }
}

function renderStrength(data) {
  const ranking = [...(data.strength_ranking || [])]
    .sort((a, b) => compareStrengthTeams(a, b, strengthSortState.key, strengthSortState.direction));
  const rows = ranking.map((team) => {
    const qualificationStatus = currentQualificationStatus(team);
    const qualificationLabelText = currentQualificationLabel(team);
    return `
    <tr class="${qualificationClass(qualificationStatus)} ${inferSubmitted(team) ? "" : "unsubmitted"}">
      <td class="rank">${team.strength_rank_global}</td>
      <td>
        <strong>${esc(team.school)}</strong>
        <div class="muted">${esc(team.team)} · ${esc(team.city)} · ${esc(team.team_type)}</div>
      </td>
      <td>${esc(team.assigned)}</td>
      <td class="score-cell">${fixedOr(team.strength_score)}</td>
      <td>${esc(team.rmul_2026_top4_cn || "—")}<div class="muted">+${fixedOr(componentScore(team, "rmul_bonus"), 1, "0.0")}</div></td>
      <td>#${team.full_form_ranking ?? "—"}<div class="muted">+${fixedOr(componentScore(team, "full_form_score"), 1, "0.0")}</div></td>
      <td>${esc(team.detail_2025_cn || "—")}<div class="muted">+${fixedOr(componentScore(team, "history_bonus"), 1, "0.0")}</div></td>
      <td>${team.rank != null ? `#${team.rank}` : "—"}<div class="muted">${team.points ?? "—"} 分 · +${fixedOr(componentScore(team, "points_score"), 1, "0.0")}</div></td>
      <td>${esc(qualificationLabelText)}</td>
      <td>${inferSubmitted(team) ? "已提交" : "预测"}<div class="muted">${esc(team.volunteer_source_label || "—")}</div></td>
    </tr>
  `;
  }).join("");

  const panel = document.getElementById("panel-strength");
  panel.innerHTML = `
    <section class="formula-card">
      <h2>综合实力模型</h2>
      <p>2025 国赛名次仍是最高权重，而且档位差拉得更平；2026 RMUL 加分保持为此前的 50%，完整形态继续负责中段分层，积分只做轻修正。</p>
      <div class="formula-grid">
        <div class="formula-item">
          <div class="title">2025 国赛战绩</div>
          <div class="formula">冠军 40 / 亚军 36 / 季军 33 / 殿军 30 / 八强 25 / 十六强 20 / 三十二强 16</div>
        </div>
        <div class="formula-item">
          <div class="title">2026 RMUL</div>
          <div class="formula">冠军 16 / 亚军 14.5 / 季军 13 / 殿军 11.5</div>
        </div>
        <div class="formula-item">
          <div class="title">完整形态</div>
          <div class="formula">28 × ((96 - rank) / 95)<sup>1.8</sup></div>
        </div>
        <div class="formula-item">
          <div class="title">积分修正</div>
          <div class="formula">优先使用 points 归一化，缺失时按 rank 百分位映射到 0..9</div>
        </div>
      </div>
    </section>
    <section class="ranking-card">
      <div class="ranking-head">
        <div>
          <h2>综合实力榜</h2>
          <p>点击表头可按综合分、RMUL、完整形态、2025 战绩、积分修正等指标排序。</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              ${sortableHeader("排名", "strength_rank_global")}
              ${sortableHeader("学校", "school")}
              ${sortableHeader("预测赛区", "assigned")}
              ${sortableHeader("综合分", "strength_score")}
              ${sortableHeader("RMUL", "rmul_bonus")}
              ${sortableHeader("完整形态", "full_form_score")}
              ${sortableHeader("2025 战绩", "history_bonus")}
              ${sortableHeader("积分修正", "points_score")}
              ${sortableHeader("资格", "qualification_status")}
              ${sortableHeader("志愿状态", "is_submitted")}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
  `;

  panel.querySelectorAll("th.sortable").forEach((th) => {
    th.addEventListener("click", () => setStrengthSort(th.dataset.sort));
  });
}

function renderMeta(data) {
  document.getElementById("updated").textContent = `${data.updated_at_cst} CST · ${fmtAgo(data.updated_at_utc)}`;
  document.getElementById("src").href = data.source.board;
  document.getElementById("ann").href = data.source.announcement;
  const meta = data.refresh_meta || {};
  const sync = document.getElementById("syncStatus");
  const status = meta.status || "idle";
  sync.className = `sync-status ${status}`;
  sync.textContent = meta.message || `当前页面显示的是 ${data.updated_at_cst} 的已生成数据。`;
}

async function loadGlobalSwissStage() {
  if (!currentData) return;
  renderGlobalSwissStage(currentData);
  try {
    await ensureGlobalSwissSamplesLoaded(currentData);
    if (currentData && currentTab() === "global-swiss") {
      renderGlobalSwissStage(currentData);
    }
  } catch (error) {
    if (currentTab() === "global-swiss") {
      document.getElementById("panel-global-swiss").innerHTML = `<div class="empty">全局瑞士轮样本池加载失败：${esc(error.message)}</div>`;
    }
  }
}

async function loadVolunteerDecisionStage() {
  if (!currentData) return;
  renderSharkDecision(currentData);
  try {
    await ensureVolunteerDecisionLoaded(currentData);
    if (currentData && currentTab() === "shark-decision") {
      renderSharkDecision(currentData);
    }
  } catch (error) {
    if (currentTab() === "shark-decision") {
      document.getElementById("panel-shark-decision").innerHTML = `<div class="empty">志愿决策数据加载失败：${esc(error.message)}</div>`;
    }
  }
}

function render(data) {
  currentData = data;
  renderMeta(data);
  renderStats(data);
  renderAdvancement(data);
  renderSwissSimulation(data);
  renderRegionStrength(data);
  renderStrength(data);
  if (currentTab() === "global-swiss") {
    void loadGlobalSwissStage();
  }
  if (currentTab() === "shark-decision") {
    void loadVolunteerDecisionStage();
  }
  if (data.fetch_error) {
    showError(`抓取失败：${data.fetch_error}`);
  } else {
    clearError();
  }
}

function setTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });
  document.querySelectorAll(".panel").forEach((panel) => {
    panel.classList.toggle("active", panel.id === `panel-${tab}`);
  });
  if (tab === "global-swiss" && currentData) {
    requestAnimationFrame(() => void loadGlobalSwissStage());
  }
  if (tab === "shark-decision" && currentData) {
    requestAnimationFrame(() => void loadVolunteerDecisionStage());
  }
}

function updateRuntimeHints() {
  const button = document.getElementById("refreshBtn");
  const footer = document.getElementById("footerNote");
  if (LOCAL_REFRESH_ENABLED) {
    button.hidden = false;
    footer.textContent = "全国赛名额按公告精确计算；复活赛名额为模型推演值。当前为本地模式，可点击刷新直接抓取轻流；页面每 60 秒检查 data.json 更新。";
    return;
  }
  button.hidden = true;
  footer.textContent = "全国赛名额按公告精确计算；复活赛名额为模型推演值。由 GitHub Actions 每 10 分钟自动同步；页面每 60 秒检查新发布数据。";
}

async function loadData() {
  const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function refreshPublishedData(force = false) {
  const payload = await loadData();
  const changed = force || !currentData || payload.updated_at_utc !== currentData.updated_at_utc;
  if (changed) {
    invalidateLazyCaches();
    render(payload);
  }
}

async function refreshData() {
  if (!LOCAL_REFRESH_ENABLED) return;
  const button = document.getElementById("refreshBtn");
  const previous = button.textContent;
  button.disabled = true;
  button.textContent = "刷新中...";
  try {
    const res = await fetch("./api/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
      cache: "no-store"
    });
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
    invalidateLazyCaches();
    render(payload);
  } catch (error) {
    const suffix = currentData
      ? `（已保留上次成功数据：${currentData.updated_at_cst} CST）`
      : "";
    showError(`刷新失败：${error.message}${suffix}`);
  } finally {
    button.disabled = false;
    button.textContent = previous;
  }
}

updateRuntimeHints();
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => setTab(btn.dataset.tab));
});
if (LOCAL_REFRESH_ENABLED) {
  document.getElementById("refreshBtn").addEventListener("click", refreshData);
}

(async () => {
  try {
    await refreshPublishedData(true);
  } catch (error) {
    document.getElementById("panel-advancement").innerHTML = `<div class="empty">数据加载失败：${esc(error.message)}</div>`;
    document.getElementById("panel-global-swiss").innerHTML = `<div class="empty">当前尚未发布全局瑞士轮样本池。</div>`;
    document.getElementById("panel-swiss-simulation").innerHTML = `<div class="empty">当前尚未发布瑞士轮模拟数据。</div>`;
    document.getElementById("panel-region-strength").innerHTML = `<div class="empty">当前尚未发布 data.json。</div>`;
    document.getElementById("panel-strength").innerHTML = `<div class="empty">当前尚未发布 data.json。</div>`;
    document.getElementById("panel-shark-decision").innerHTML = `<div class="empty">当前尚未发布志愿决策数据。</div>`;
    showError(`初始加载失败：${error.message}`);
  }
})();

setInterval(async () => {
  try {
    await refreshPublishedData(false);
  } catch (error) {
    console.warn("auto refresh failed:", error);
  }
}, POLL_INTERVAL_MS);
</script>
