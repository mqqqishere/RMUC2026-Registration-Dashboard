name: Refresh dashboard data (manual only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard docs
        run: python scripts/build_dashboard.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data.csv docs/volunteer_decision.json docs/global_swiss_samples.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          exit 1
