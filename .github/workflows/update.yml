name: Build and deploy dashboard

on:
  workflow_dispatch: {}
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches: [main]
    paths:
      - "allocator.py"
      - "qualification.py"
      - "qingflow.py"
      - "distances.csv"
      - "ranks.csv"
      - "robomaster_2026_teams.csv"
      - "scripts/build_dashboard.py"
      - "scripts/shark_decision.py"
      - "docs/index.html"
      - ".github/workflows/update.yml"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build dashboard docs
        run: python scripts/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
