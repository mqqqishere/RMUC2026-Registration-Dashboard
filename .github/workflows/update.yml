name: Build and deploy dashboard

on:
  workflow_dispatch: {}
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches: [main]
    paths:
      - "allocator.py"
      - "qualification.py"
      - "swiss_simulation.py"
      - "qingflow.py"
      - "distances.csv"
      - "ranks.csv"
      - "robomaster_2026_teams.csv"
      - "scripts/build_dashboard.py"
      - "scripts/shark_decision.py"
      - "docs/index.html"
      - ".github/workflows/update.yml"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build dashboard docs
        run: python scripts/build_dashboard.py

      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data.csv docs/volunteer_decision.json docs/global_swiss_samples.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          exit 1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
